# النصوص التي استشهد بها الأستاذ أنس شيخ اكريم في حلقة «بناء العادات» (4EkrbmmIlno).
#
# قاعدة المالك (28 أكتوبر 2026): «كل الأحاديث التي أوردها أنس خذها عادي مع الحكم الذي بيّنه، وإذا ما حكى فهو صحيح».
#   - his_grade: حكمه كما قاله في الحلقة، أو null إذا لم يذكر حكمًا.
#   - applied_grade: الحكم الذي يُعرض بقاعدة المالك (his_grade إن وُجد، وإلا «صحيح»).
#   - candidate_ref: تعريفي أنا للنص (الكتاب والرقم أو الباب) ليُبحث عنه في القاعدة. **غير مؤكَّد** حتى تتم المطابقة.
#   - lines: أرقام الأسطر في transcripts/4EkrbmmIlno.txt.
#   - hint: كلمات من لفظه للبحث، وليست نصًا للنشر. التفريغ آلي ويخطئ.
#
# ما لا يتغيّر بهذه القاعدة (من قواعد المشروع):
#   - نص القرآن يُؤخذ من القاعدة فقط. الآيات هنا للتعريف (السورة والآية) لا غير.
#   - نص الحديث يُؤخذ من القاعدة إن وُجد. وإن لم يوجد يُسجَّل للمالك، ولا يُنشر لفظ التفريغ.
#   - الأثر (قول صحابي أو تابعي) يبقى تحت قاعدة الأثر ويُعلَّم «أثر، وليس حديثًا».
#   - إن كان الحديث منشورًا أصلًا بحكم أقوى (الصحيحان وغيرهما)، يبقى حكمه، ولا يُستبدل بحكم المحاضرة.

