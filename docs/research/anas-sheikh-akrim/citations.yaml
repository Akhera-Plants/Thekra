    text_as_said: "تزوّج عبد الله بن عمرو بن العاص، فزار أبوه زوجته وسأل عنه، فأثنت عليه غير أنه لم يقربها، لأنه كان يصوم كل يوم ويقوم الليل ويختم القرآن في ليلة. فقال له ﷺ: لا تفعل، اقرأه في كل ثلاثين. قال: إني أطيق أكثر من ذلك. قال: اقرأه في عشرين … في عشر … فاقرأه في كل سبع ولا تزد على ذلك. وقال له في الصيام: صم ثلاثة أيام، فإن لك بكل حسنة عشرًا، وذلك صيام الدهر كله. فلما طلب أكثر قال: صم يومًا وأفطر يومًا، فإنك لا تدري لعله يطول بك عمر. قال عبد الله لما كبر: شدّدتُ فشُدّد عليّ، ولو أني أخذت برخصة رسول الله ﷺ."
    asr_corrections: "قال المتحدث: «عم بحكي بلغتي ملخص المعنى» (س 255)؛ التفريغ: «عبدالله معون العاص» ← «عبد الله بن عمرو بن العاص»"
