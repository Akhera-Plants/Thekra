packages:
  - "backend"
  - "frontend"
  - "mobile"

# One React types version. frontend's ^19 was resolving to 19.3.0 while
# mobile pinned 19.2.x, and the two copies broke frontend tsc.
overrides:
  "@types/react": "19.2.18"
  # GHSA-ggr8-5vv4-36mx (deepmerge-ts < 8). Prisma 6.19.3's @prisma/config pins
  # 7.1.5; Prisma 7's @prisma/config already uses 8.0.2 with the same
  # `deepmerge()` call. Drop this once Prisma is upgraded.
  "@prisma/config>deepmerge-ts": "8.0.2"
# Dependency build scripts must be explicitly allow-listed by pnpm >= 10.
# esbuild/workerd come from the NestJS + Vitest toolchain installed by the
# Nest CLI; @prisma/engines, prisma and @prisma/client need their install
# hooks to fetch the engines used by `prisma validate|format|generate`;
# unrs-resolver comes from the Next.js ESLint toolchain.
allowBuilds:
  '@parcel/watcher': true
  react-native-reanimated: true
  '@react-native-async-storage/async-storage': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true
