  - { id: adff0e0a-4935-4d6e-93ee-6302c83ad430, book: bukhari, title: "باب إذا بين البيعان ولم يكتما ونصحا ويذكر عن العداء بن خالد، قال: كتب لي النبي صلى الله عليه وسلم: «هذا ما اشترى محمد رسول الله صلى الله عليه وسلم، من العداء بن خالد، بيع المسلم من المسلم، لا داء ولا خبثة، ولا غائلة» وقال قتادة: «الغائلة الزنا، والسرقة، والإباق» وقيل لإبراهيم: إن بعض النخاسين يسمي آري خراسان، وسجستان، فيقول: جاء أمس من خراسان، جاء اليوم من سجستان، فكرهه كراهية شديدة وقال عقبة بن عامر: «لا يحل لامرئ يبيع سلعة يعلم أن بها داء إلا أخبره»", topics: [sidq] }
