  - { id: a9410b88-b4da-4a27-8408-2ecc1a14e27c, book: bukhari, title: "باب قول الله تعالى: {يا أيها الذين آمنوا لا تأكلوا الربا أضعافا مضاعفة واتقوا الله لعلكم تفلحون} [آل عمران: 130]", topics: [riba] }
  - { id: 13eb209e-49bf-4cd3-ab19-c58510900f97, book: bukhari, title: "باب آكل الربا وشاهده وكاتبه وقوله تعالى: {الذين يأكلون الربا لا يقومون إلا كما يقوم الذي يتخبطه الشيطان من المس ذلك بأنهم قالوا: إنما البيع مثل الربا، وأحل الله البيع وحرم الربا، فمن جاءه موعظة من ربه فانتهى فله ما سلف وأمره إلى الله، ومن عاد فأولئك أصحاب النار هم فيها خالدون} [البقرة: 275]", topics: [riba] }
  - { id: 52f770df-3274-4786-9acb-ba5f9dee829e, book: bukhari, title: "باب موكل الربا لقول الله تعالى: {يا أيها الذين آمنوا اتقوا الله وذروا ما بقي من الربا إن كنتم مؤمنين، فإن لم تفعلوا فأذنوا بحرب من الله ورسوله وإن تبتم فلكم رءوس أموالكم لا تظلمون ولا تظلمون وإن كان ذو عسرة فنظرة إلى ميسرة وأن تصدقوا خير لكم إن كنتم تعلمون. واتقوا يوما ترجعون فيه إلى الله ثم توفى كل نفس ما كسبت وهم لا يظلمون} قال ابن عباس: «هذه آخر آية نزلت على النبي صلى الله عليه وسلم»", topics: [riba] }
  - { id: 98c95ae9-80cf-4061-8b6b-611136f7cc42, book: bukhari, title: "باب: {يمحق الله الربا ويربي الصدقات والله لا يحب كل كفار أثيم} [البقرة: 276]", topics: [riba] }
  - { id: ab1cd091-716b-4480-b0f9-cbbb3d69d142, book: muslim, title: باب لعن آكل الربا ومؤكله, topics: [riba] }

