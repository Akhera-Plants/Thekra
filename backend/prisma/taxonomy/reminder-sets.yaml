# «مجموعات التذكير» (redesign phase 6, docs/plan/2026-10-31-redesign-final.md §4.6): starter sets for «نص اليوم» on the
# home-screen widget, the extension's new-tab page and the app. Imported into the database with
#   pnpm --filter backend reminder-sets:import            (dry run: shows what would change)
#   pnpm --filter backend reminder-sets:import --apply    (writes; local database only unless you mean otherwise)
# and edited afterwards in the curation desk (/admin/reminder-sets). Re-running the import sets these slugs back to
# this file; a second run writes nothing.
#
# Rules
#   - Items are public Quote ids only (a Quran verse or a sahih/hasan hadith; no athar). The text is always read from
#     the database by id; nothing in this file is a quoted text, and no id here is invented.
#   - Every id already appears in another reviewed file (deed-schedules.yaml, sin-programs.yaml, heart-texts.yaml or
#     docs/research/**/citations.yaml); the unit test checks it. The note after each id says where it comes from.
#   - The import and the desk both refuse an id that is not a published verse or sahih/hasan hadith in the database
#     they write to, and the public read filters again, so an unpublished text never shows.
#   - A set with few items stays short until more ids are checked; nothing is added to fill it.
#   - Reviewed by: pending the sheikh.

