# Habits for «أعِنّي على طاعة» and reminders (extension, mobile, web).
habits:
  - key: duha
    titleAr: صلاة الضحى
    titleEn: Duha prayer
    deed: nawafil
    unit: times
    unitLabelAr: ركعتان
    unitLabelEn: two rak'ahs
    start: { far: 1, near: 1 }
    defaultRule: { kind: daily }
    timeHintAr: بعد ارتفاع الشمس إلى ما قبل الظهر
    timeHintEn: after the sun has risen, until before Dhuhr
    defaultSlots: ['09:30', '11:00']
    basis: text
    evidence: [93f7d1ab-b6f7-4521-bae8-f37cc1ff06a2, aa18c734-8541-4cea-a9b9-f3efcf432b31, 9b96171e-8218-49a3-bfdd-c94f65b126a1]
  - key: witr
    titleAr: الوتر قبل النوم
    titleEn: Witr before sleeping
    deed: nawafil
    unit: times
    unitLabelAr: ركعة واحدة على الأقل
    unitLabelEn: at least one rak'ah
    start: { far: 1, near: 1 }
    defaultRule: { kind: daily }
    timeHintAr: بعد العشاء وقبل النوم
    timeHintEn: after Isha, before sleeping
    defaultSlots: ['22:00', '23:00']
    basis: text
    evidence: [0bda155b-e786-4616-a380-56be0031c5c2, 93f7d1ab-b6f7-4521-bae8-f37cc1ff06a2]
