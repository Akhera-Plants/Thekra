    titleAr: صيام الأيام البيض (13 و14 و15 من الشهر الهجري)
    titleEn: Fasting the White Days (13th–15th of the Hijri month)
    deed: siyam
    rule: { kind: hijriMonthDays, days: [13, 14, 15] }
    basis: text
    evidence: [e4a9c1f0-c53a-4f1c-9418-aaf4bbb8cd13, 93f7d1ab-b6f7-4521-bae8-f37cc1ff06a2]
  - key: ithnayn-khamis
    titleAr: صيام الاثنين والخميس
    titleEn: Fasting Mondays and Thursdays
    deed: siyam
