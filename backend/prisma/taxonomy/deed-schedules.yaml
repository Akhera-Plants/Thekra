# Deed schedules: the sunnah timings (public calendar) and the small starting units for
# «أعِنّي على طاعة». Plan: docs/plan/2026-10-features-roadmap.md §2–§3.
# Method for units, steps and compensation: docs/research/anas-sheikh-akrim/4EkrbmmIlno-analysis.md §4.
#
# Rules
#   - `deed` is an existing GoodDeed slug; the page of that deed is where the reminder leads.
#   - `rule` uses the @thekra/practice-core Rule shape (hijri month 1 = Muharram, 9 = Ramadan, 10 = Shawwal, 12 = Dhu al-Hijja;
#     weekdays 0 = Sunday … 6 = Saturday).
#   - `basis: text` = the timing is stated in the evidence; `basis: organizational` = a suggested rhythm, not a
#     religious timing (the UI must say so: «اقتراح لتنظيم الوقت، وليس توقيتًا شرعيًا»).
#   - `evidence` are Quote ids that are public on the site (checked 2026-10-28 against production). The text is always
#     read from the database; nothing here is a quoted text.
#   - Units: `start.far` for someone far from the habit, `start.near` for someone close to it (lecture: «دقيقتان» / 5–10).
#     Increase only with the ladder in practice-core, never before 4 weeks of steady practice.
#   - Reviewed by: pending the sheikh (owner approved publishing 2026-10-28).

occasions:
