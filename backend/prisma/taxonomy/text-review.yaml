texts:
  # "إنما بعثت قاسما أقسم بينكم وقال سليمان فإنما أنا قاسم أقسم بينكم"
  - { id: 00579e96-4518-4462-858e-04c6b7956476, ref: "مسلم 2133", reason: fragment, decision:  }
  # "«أولكلكم ثوبان»"
  - { id: 00f0949b-eb70-4233-8333-d71cf22364e8, ref: "البخاري 358", reason: short, decision:  }
  # "«في العسل والحجم»"
  - { id: 018a6445-d701-48fb-91c5-6142e8b3acd3, ref: "البخاري 5680", reason: short, decision:  }
  # "لا نورث ما تركنا صدقة"
  - { id: 02869174-3bde-4851-89c1-840a68b3c20e, ref: "مسلم 1761", reason: short, decision:  }
  # "«كل مسكر حرام»"
  - { id: 031d355a-3c19-4b8f-bc63-21d6c579937a, ref: "البخاري 6124", reason: short, decision:  }
  # "لصاحبيه ما أنصفنا أصحابنا"
  - { id: 038ca5fd-8642-4344-907a-f52beb676bbc, ref: "مسلم 1789", reason: short, decision:  }
  # "«لا يدخل الجنة قتات»"
  - { id: 04858f36-a4b3-42d0-81e8-da96bbc732e9, ref: "البخاري 6056", reason: short, decision:  }
  # "«العائد في هبته كالعائد في قيئه»"
  - { id: 04873e0e-33c3-427e-a359-e9d20ff705aa, ref: "البخاري 2621", reason: short, decision:  }
  # "فصوموه أنتم"
  - { id: 04ca0d0c-1a18-4217-ac7f-688f69e2a34e, ref: "مسلم 1131", reason: short, decision:  }
  # "لا يكون له سمسارا"
  - { id: 04e604f8-eec7-4f47-b539-f5be149aaee3, ref: "البخاري 2274", reason: short, decision:  }
  # "حين توفي سجي ببرد حبرة»"
  - { id: 053eb4e8-2274-4a6c-9e7a-f191cee96b7b, ref: "البخاري 5814", reason: short, decision:  }
  # "«إن عبد الله رجل صالح، لو كان يصلي من الليل» فقال نافع: «فلم يزل بعد ذلك يكثر الصلاة»"
  - { id: 058eb7c2-13db-446f-881f-d9c9ba570b20, ref: "البخاري 7029", reason: fragment, decision:  }
  # "«لا تتمنوا الموت» لتمنيت"
  - { id: 06329639-9005-498e-bfca-2643ae6bf68a, ref: "البخاري 7233", reason: short, decision:  }
  # "«من جاء منكم الجمعة فليغتسل»"
  - { id: 0667afae-f7d6-47dc-9dc9-9ecb92eab71d, ref: "البخاري 894", reason: short, decision:  }
  # "سأل زينب بنت جحش عن أمري، فقال لزينب: «ماذا علمت، أو رأيت». فقالت: يا رسول الله أحمي سمعي وبصري، والله ما علمت إلا خيرا،"
  - { id: 0707fee8-7577-42cf-b443-618166cccea2, ref: "البخاري 4141", reason: fragment, decision:  }
  # "«الشؤم في المرأة، والدار، والفرس»"
  - { id: 073d8153-3d51-4eb9-9cf3-cd77f8229246, ref: "البخاري 5093", reason: short, decision:  }
  # "«أكفئوا القدور»"
  - { id: 08076451-45ac-4ff6-8ed4-b02b3d1d305e, ref: "البخاري 4221", reason: short, decision:  }
  # "\" أشكر الناس لله أشكرهم للناس \""
  - { id: 08c721f8-a6f0-499c-8928-895de7048800, ref: "مسند أحمد (ط. قرطبة)، رقم 21895", reason: short, decision:  }
  # "يلبسها فنحن نغسلها للمرضى يستشفى بها"
  - { id: 09019a99-dd43-4183-97d7-c8e8a47ad8fb, ref: "مسلم 2069", reason: fragment, decision:  }
  # "\" اللهم كما حسنت خلقي فأحسن خلقي \""
  - { id: 09a23a64-272a-45e6-b3fa-381e581b240f, ref: "- مسند الإمام أحمد بن حنبل، المحقق: شعيب الأرنؤوط - عادل مرشد، وآخرون إشراف: د عبد الله بن عبد المحسن التركي مؤسسة الرسالة الطبعة: الأولى، 1421 هـ - 2001 م.", reason: short, decision:  }
  # "«لا آكل متكئا»"
  - { id: 09c6c2df-8982-4438-828f-73c929b2508c, ref: "البخاري 5398", reason: short, decision:  }
  # "«الجار أحق بصقبه» ما أعطيتك"
  - { id: 0a22c80e-732f-4f30-acc6-334984830785, ref: "البخاري 6981", reason: short, decision:  }
  # "«الشمس والقمر مكوران يوم القيامة»"
  - { id: 0a5580d7-f2d1-42a1-a94b-55d81358060a, ref: "البخاري 3200", reason: short, decision:  }
  # "أشهدوا أشهدوا"
  - { id: 0a59da38-487e-4745-b1d9-6b556a3522a1, ref: "مسلم 2801", reason: short, decision:  }
  # "«إذا سمعتم به بأرض فلا تقدموا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه» قال: فحمد الله عمر ثم انصرف"
  - { id: 0a681f84-512d-4b3b-b0f1-b37a1165564f, ref: "البخاري 5729", reason: fragment, decision:  }
  # "كان يغتسل بفضل ميمونة"
  - { id: 0aa049bc-b4e0-478d-bda8-0a99a37e0000, ref: "مسلم 323", reason: short, decision:  }
  # "نعم ورب هذا البيت"
  - { id: 0ad41327-d2f7-46ef-b85e-383422d7d65c, ref: "مسلم 1143", reason: short, decision:  }
  # "بمعنى حديث هشام بن عروة"
  - { id: 0b0fc061-eb59-4903-932d-07895d3b1c1e, ref: "مسلم 2243", reason: short, decision:  }
  # "«وهل ترك لنا عقيل من منزل»"
  - { id: 0b46c339-02f9-4b65-81c2-8f306a397b21, ref: "البخاري 4282", reason: fragment, decision:  }
  # "لعمار تقتلك الفئة الباغية"
  - { id: 0ba186e4-80c9-4141-9035-d510e1deeb1f, ref: "مسلم 2916", reason: short, decision:  }
  # "اجعلوا آخر صلاتكم بالليل وترا"
  - { id: 0bda155b-e786-4616-a380-56be0031c5c2, ref: "مسلم 751", reason: short, decision:  }
  # "«أسلمت على ما سلف لك من خير»"
  - { id: 0c55921d-b3f9-4c22-85cd-bffc2ea60dc4, ref: "البخاري 2220", reason: fragment, decision:  }
  # "«اجعلوا آخر صلاتكم بالليل وترا»"
  - { id: 0c5cb483-4a60-4afe-8497-01419d1fe845, ref: "البخاري 998", reason: short, decision:  }
  # "أحد عمومتي"
  - { id: 0c8becd2-893f-4284-901b-31a74a773c95, ref: "البخاري 3810", reason: short, decision:  }
  # "أمرني بهذا»"
  - { id: 0cbe8c45-990e-427a-a50c-42967d65bda5, ref: "البخاري 5332", reason: short, decision:  }
  # "صلى إلى بعير"
  - { id: 0d44b97e-70a4-48af-8ebe-62f91322ccfb, ref: "مسلم 502", reason: short, decision:  }
  # "«الولد للفراش وللعاهر الحجر» وقال ابن شهاب: وكان أبو هريرة يصيح بذلك"
  - { id: 0d453c06-6df5-430e-9e73-9a2952bed887, ref: "البخاري 4303", reason: fragment, decision:  }
  # "«عرضت علي النار وأنا أصلي»"
  - { id: 0de0ba69-7f62-4022-8c3f-f54e30a5bcf9, ref: "البخاري 430", reason: short, decision:  }
  # "بنحو هذا أو بمثله"
  - { id: 0e77bc9f-696a-4ffd-b5c9-cf5138251901, ref: "مسلم 2468", reason: short, decision:  }
  # "«التوكل على الله جماع الإيمان»"
  - { id: 0e7a0a28-96e5-4b0a-95b8-c147814134e9, ref: "", reason: short, decision:  }
  # "«يسروا ولا تعسروا، وسكنوا ولا تنفروا»"
  - { id: 0e82eaeb-f985-4e82-92e3-4190bee5cade, ref: "البخاري 6125", reason: short, decision:  }
  # "«من لا يشكر الناس لا يشكر الله»"
  - { id: 0eb93197-cf58-44df-b3b7-adb74e7f764b, ref: "سنن أبي داود (7/ 188) (4811).", reason: short, decision:  }
  # "بهذا الحديث"
  - { id: 0ec3d448-f7fc-4927-b00c-1df99f130889, ref: "مسلم 132", reason: short, decision:  }
  # "لأشج عبد القيس: «إن فيك خصلتين يحبهما الله الحلم، والأناة»"
  - { id: 0eefcd52-19fc-4185-a823-8ca091052bc7, ref: "مسلم 18", reason: fragment, decision:  }
  # "حلق رأسه في حجة الوداع"
  - { id: 0f7e1c1c-1eec-4326-a77b-f61f31620bc0, ref: "مسلم 1304", reason: short, decision:  }
  # "قال: «هذا جبل يحبنا ونحبه»"
  - { id: 0ff5cccd-df88-481a-9671-06d0446f92fe, ref: "البخاري 4083", reason: short, decision:  }
  # "«وجدته بحرا» يعني الفرس"
  - { id: 1068058b-4cbc-4eda-968d-9a5c681d868a, ref: "البخاري 3040", reason: short, decision:  }
  # "«الولد للفراش، وللعاهر الحجر»"
  - { id: 10953149-1125-479f-9316-8c1725b5bf02, ref: "البخاري 6818", reason: short, decision:  }
  # "الطاعون شهادة لكل مسلم"
  - { id: 109755de-3fc1-43d3-886f-26928f4a0dc2, ref: "مسلم 1916", reason: short, decision:  }
  # "بمثل حديث معمر"
  - { id: 11922203-8a55-443f-979f-1cb7e2fcd25e, ref: "مسلم 1458", reason: short, decision:  }
  # "يسأل زينب ابنة جحش عن أمري، فقال: «يا زينب ماذا علمت أو رأيت؟» فقالت: يا رسول الله أحمي سمعي وبصري، ما علمت إلا خيرا، قا"
  - { id: 120ed409-384a-4468-a69b-bb65dd9a0b52, ref: "البخاري 4750", reason: fragment, decision:  }
  # "«صدق، فأعطه». فأعطانيه، فابتعت به مخرفا في بني سلمة، فإنه لأول مال تأثلته في الإسلام،"
  - { id: 125f4afe-e0b5-4244-9fef-85ad18b85b31, ref: "البخاري 4321", reason: fragment, decision:  }
  # "فأمر رجلا من القوم فجاء بدلو من ماء فشنه عليه"
  - { id: 12812f82-cfd0-4227-b5a0-65e6b5293a0f, ref: "مسلم 285", reason: fragment, decision:  }
  # "«لا يقربنها حتى يطوف بين الصفا والمروة»"
  - { id: 129287ec-80e0-4a71-8d60-34caf38c8ae1, ref: "البخاري 1646", reason: fragment, decision:  }
  # "توضئوا مما مست النار"
  - { id: 12cbcc6c-1366-4917-b70d-5d7eacb3a2ab, ref: "مسلم 352", reason: short, decision:  }
  # "«إن الميت ليعذب ببكاء أهله عليه»،"
  - { id: 131a40c7-0319-4cb6-811e-9ba91df9efce, ref: "البخاري 1286", reason: fragment, decision:  }
  # "«التودد إلى الناس نصف العقل»"
  - { id: 133d7eaf-68f7-4bc5-8474-c0547049fbc9, ref: "", reason: short, decision:  }
  # "كان ذلك يوم الخندق"
  - { id: 13795ea8-cb87-4318-aab7-654ac3d5713b, ref: "مسلم 3020", reason: short, decision:  }
  # "بنحو حديث عطاء وأبي الزبير وعمرو بن دينار"
  - { id: 13b70ae2-2951-459a-b944-0c63f8497075, ref: "مسلم 1552", reason: fragment, decision:  }
  # "اللهم إني أحبه فأحبه وأحبب من يحبه"
  - { id: 14b00135-a417-4a36-8a9a-01a46e032928, ref: "مسلم 2421", reason: fragment, decision:  }
  # "عند ذلك إن الرجل ليعمل عمل أهل الجنة فيما يبدو للناس وهو من أهل النار وإن الرجل ليعمل عمل أهل النار فيما يبدو للناس وهو"
  - { id: 14b8fc2d-c4e5-4c51-91e7-d2aa767e24a1, ref: "مسلم 112", reason: fragment, decision:  }
  # "كان يفعله"
  - { id: 1550ecf0-f5a4-43f0-b43e-41bfaf491188, ref: "البخاري 1095", reason: short, decision:  }
  # "صلى وذلك في رمضان»"
  - { id: 15cf37b3-9afc-483e-8eab-445fbd8969cf, ref: "البخاري 2011", reason: short, decision:  }
  # "وقت صلاتكم بين ما رأيتم"
  - { id: 15eff6a2-b35d-4d35-9d8e-63d3ab708ffa, ref: "مسلم 613", reason: short, decision:  }
  # "«اذهبوا به فارجموه» وكان قد أحصن"
  - { id: 16049fd7-7f7f-4fa6-a9a1-0104a4986f88, ref: "البخاري 5271", reason: fragment, decision:  }
  # "يقسم لعائشة يومين يومها ويوم سودة"
  - { id: 16595e04-c95c-4196-a1d7-631255df4d13, ref: "مسلم 1463", reason: fragment, decision:  }
  # "\" قد قلت: وعليكم \""
  - { id: 16845393-82a1-40ef-8ebf-7df7a62f9bce, ref: "البخاري 6024", reason: short, decision:  }
  # "أهل بالحج مفردا"
  - { id: 169354f0-f2ee-46b1-a228-3e35d92b73ab, ref: "مسلم 1231", reason: short, decision:  }
  # "كان يفعله"
  - { id: 16b4315b-28e9-4b35-939a-a2fcad077711, ref: "البخاري 1096", reason: short, decision:  }
  # "خرجت من النار فنظروا فإذا هو راعي معزى"
  - { id: 1700f8aa-694e-4fea-b110-6f902cc289f6, ref: "مسلم 382", reason: fragment, decision:  }
  # "«نعم إذا رأت الماء»"
  - { id: 17778c45-83f2-4d5e-83c0-0f6a1644d77f, ref: "البخاري 282", reason: short, decision:  }
  # "نهى عن الدباء والمزفت"
  - { id: 17a22256-1cf7-4b24-8548-6d51fa0e4d01, ref: "مسلم 1994", reason: short, decision:  }
  # "«زوج معقل أخته فطلقها تطليقة»"
  - { id: 17cbc0f9-77b6-4bcd-a1f3-ee42289baf02, ref: "البخاري 5330", reason: short, decision:  }
  # "كان يأمر بالغسل»"
  - { id: 180c007e-5513-4988-93de-cea59d1d56f4, ref: "البخاري 878", reason: short, decision:  }
  # "في هذا المسجد"
  - { id: 18b30ba6-7b20-49e6-b074-8282bb053c47, ref: "مسلم 113", reason: short, decision:  }
  # "بمثله، إلا النهبة"
  - { id: 18ce7ce6-9aec-489c-8464-c4713042b7a2, ref: "البخاري 6772", reason: short, decision:  }
  # "أن جارية لكعب: بهذا"
  - { id: 18e2dc18-430d-4e31-a7cc-08814a734fa3, ref: "البخاري 5504", reason: short, decision:  }
  # "«خير دور الأنصار بنو النجار»"
  - { id: 1982534d-dd40-4717-a96b-53d03bb3234b, ref: "البخاري 6053", reason: short, decision:  }
  # "«يقتل المحرم»"
  - { id: 1987dd03-d48c-4139-9e5d-42a3c6cab352, ref: "البخاري 1827", reason: short, decision:  }
  # "«نصرت بالصبا، وأهلكت عاد بالدبور»"
  - { id: 19fdb259-cdf9-42d4-8c97-27b597463c96, ref: "البخاري 4105", reason: short, decision:  }
  # "« هو لك يا عبد الله»"
  - { id: 1a1f2e33-fc92-49cd-8c50-2e6eeecb273e, ref: "البخاري 2611", reason: short, decision:  }
  # "إن الكافر يأكل في سبعة أمعاء"
  - { id: 1a90660c-f564-4532-8386-31c4f7c3f6d9, ref: "مسلم 2060", reason: fragment, decision:  }
  # "كان «يحدث حديثا لو عده العاد لأحصاه»"
  - { id: 1aab9a7f-1bb0-4de6-889b-94d63c00a22b, ref: "البخاري 3567", reason: fragment, decision:  }
  # "«مستريح ومستراح منه، المؤمن يستريح»"
  - { id: 1ab19b10-6b88-41f9-8a1b-c9393dda0369, ref: "البخاري 6513", reason: short, decision:  }
  # "«وأتبع أصحاب القليب لعنة»"
  - { id: 1b7a6f09-98bc-4b6a-9c7e-02a6bc4992f1, ref: "البخاري 520", reason: short, decision:  }
  # "أخذها من مجوس هجر \""
  - { id: 1cb13b32-4e2f-4878-9c78-14b530816cb8, ref: "البخاري 3157", reason: short, decision:  }
  # "«أولم ولو بشاة»"
  - { id: 1d482a53-2bb2-4727-bff1-658e0473a2c9, ref: "البخاري 5153", reason: short, decision:  }
  # "«ما بين لابتيها حرام»"
  - { id: 1d64c915-dea7-4b52-baf8-8e336e60542b, ref: "البخاري 1873", reason: short, decision:  }
  # "«ثلاث للمهاجر بعد الصدر»"
  - { id: 1d719f23-f40a-432e-ba3b-8babe0aaaed4, ref: "البخاري 3933", reason: short, decision:  }
  # "«إنما هذا من إخوان الكهان»"
  - { id: 1d7f2e0f-08b3-4484-867b-62fef46091e2, ref: "البخاري 5760", reason: short, decision:  }
  # "خرج يوم الفطر، فبدأ بالصلاة قبل الخطبة»"
  - { id: 1da87ad1-5f52-4b8b-ae4c-472735c6d7b3, ref: "البخاري 958", reason: fragment, decision:  }
  # "قال: «لا ربا إلا في النسيئة»"
  - { id: 1db5b51f-b4ea-4add-8e68-9555fce954a7, ref: "البخاري 2178", reason: fragment, decision:  }
  # "«يا أنجش، رويدك سوقك بالقوارير»"
  - { id: 1e030d1b-34fd-4391-948f-c739794b9072, ref: "البخاري 6202", reason: short, decision:  }
  # "«العين حق» ونهى عن الوشم"
  - { id: 1e14526f-6a7c-4c43-a44a-6c59765928e7, ref: "البخاري 5740", reason: short, decision:  }
  # "«له أجران أجر القرابة والصدقة»"
  - { id: 1e540194-0cc9-44ed-91d4-8206ba87ccb1, ref: "البخاري 1460", reason: short, decision:  }
  # "استسقى فقلب رداءه»"
  - { id: 1eed3b2e-8c89-4e5f-9665-22fafa0d166a, ref: "البخاري 1011", reason: short, decision:  }
  # "أمرها بقتل الأوزاغ»"
  - { id: 1f1ebd5c-c50c-43a9-85d4-2b1f7f4521f4, ref: "البخاري 3307", reason: short, decision:  }
  # "مدكر دالا"
  - { id: 1fc1715b-f3fc-4727-b71e-3a727ae13725, ref: "مسلم 823", reason: short, decision:  }
  # "«إن من عباد الله من لو أقسم على الله لأبره»"
  - { id: 20b1ec7d-5352-4bcc-9ec8-cff2093ec993, ref: "البخاري 2806", reason: fragment, decision:  }
