  # "«الثلث والثلث كثير أو كبير»"
  - { id: 45b21d63-b271-4068-8eb9-fa59bb5fa017, ref: "البخاري 2743", reason: short, decision:  }
  # "«لا تصاحبنا ناقة عليها لعنة»"
  - { id: 4669041d-c3d7-4ab3-89d9-6f65d8d896f5, ref: "مسلم 2596", reason: short, decision:  }
  # "بل أرجو أن يخرج الله من أصلابهم من يعبد الله وحده، لا يشرك به شيئا \""
  - { id: 466d80ed-cab5-4a51-8fbc-cbd33170eff7, ref: "البخاري 3231", reason: fragment, decision:  }
  # "مثله، وقال: «فاغفر للأنصار»"
  - { id: 4691aaef-66c7-4784-80fa-c7689d74095b, ref: "البخاري 3795", reason: short, decision:  }
  # "إي ورب هذا المسجد"
  - { id: 46f422c7-6d6c-4887-b99e-8aed1c4023b9, ref: "مسلم 1576", reason: short, decision:  }
  # "يا موسى، قد والله استحييت من ربي مما اختلفت إليه، قال: فاهبط باسم الله قال: واستيقظ وهو في مسجد الحرام \""
  - { id: 4711e923-4335-4a3d-9984-0b0be2d4406a, ref: "البخاري 7517", reason: fragment, decision:  }
  # "«استقبل القبلة وكبر»"
  - { id: 4724b1d1-b308-42e6-b24e-831cf7ebba0d, ref: "البخاري 398", reason: short, decision:  }
  # "«ولو خاتما من حديد»"
  - { id: 4782e732-ffe5-4b11-8230-c98905e08d97, ref: "البخاري 5147", reason: short, decision:  }
  # "يجمع أبويه لأحد غير سعد»"
  - { id: 47a84e35-38f0-4bec-92c3-c95d6b699bfb, ref: "البخاري 4058", reason: short, decision:  }
  # "صدق الله وكذب بطن أخيك فسقاه فبرأ"
  - { id: 4887c69f-46fa-4e7f-a270-4c69b8b072be, ref: "مسلم 2217", reason: fragment, decision:  }
  # "«إلى أقربهما منك بابا»"
  - { id: 48c7b51b-18ff-481c-a8da-914b9f533f32, ref: "البخاري 2259", reason: short, decision:  }
  # "استغفر لي قال وكيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة قال فجعل لا يزيده على أن يقول كيف تصنع بلا إله إلا الله إذ"
  - { id: 4900499c-e730-41a7-8f54-6830e87bba7b, ref: "مسلم 97", reason: fragment, decision:  }
  # "لم يحل حتى بلغ الهدي محله"
  - { id: 492f638e-3eca-4bb3-8820-7f4cae903614, ref: "مسلم 1221", reason: fragment, decision:  }
  # "\" إن المؤمن يموت بعرق الجبين \""
  - { id: 4959bbcf-b061-4e82-b915-24355b25c0b0, ref: "مسند أحمد (ط. قرطبة)، رقم 23014", reason: short, decision:  }
  # "«لكم أنتم يا أهل السفينة هجرتان»"
  - { id: 4959c410-195a-4e1b-827f-22c2eac16e2f, ref: "البخاري 3876", reason: fragment, decision:  }
  # "فذلك إذنها إذا هي سكتت"
  - { id: 49832a71-4261-43c9-9167-89cad62f7adf, ref: "مسلم 1420", reason: short, decision:  }
  # "كان يتخولنا بالموعظة في الأيام مخافة السآمة علينا"
  - { id: 49b27a8b-0dea-44f2-88e8-afdfe8258552, ref: "مسلم 2821", reason: fragment, decision:  }
  # "«إن له مرضعا في الجنة»"
  - { id: 49d7b7ae-2b06-4099-8047-5672a886d1c5, ref: "البخاري 6195", reason: short, decision:  }
  # "شثن القدمين والكفين»"
  - { id: 49e5a154-ba9a-4b76-a6cf-d58a1cfe1b11, ref: "البخاري 5910", reason: short, decision:  }
  # "«اضربوا لي معكم سهما»"
  - { id: 49fe8a53-91b3-407e-8aa6-64c90fbf483f, ref: "البخاري 2568", reason: short, decision:  }
  # "أحمي سمعي وبصري والله ما علمت إلا خيرا قالت عائشة وهي التي كانت تساميني من أزواج النبي صلى الله عليه وسلم فعصمها الله با"
  - { id: 4a5441e4-2d3f-471c-be30-ac98d3beba9b, ref: "مسلم 2770", reason: fragment, decision:  }
  # "وددنا أن موسى صبر حتى يقص علينا من أمرهما \" قال: وكان ابن عباس يقرأ: «وكان أمامهم ملك يأخذ كل سفينة صالحة غصبا، وأما الغ"
  - { id: 4a7a9618-532a-431c-ac34-8ca0b778a202, ref: "البخاري 4727", reason: fragment, decision:  }
  # "«إنما هذا من إخوان الكهان»"
  - { id: 4a7e6eb5-36e7-4935-a0c4-4508e7b99bde, ref: "البخاري 5758", reason: short, decision:  }
  # "هذه رحمة جعلها الله في قلوب عباده وإنما يرحم الله من عباده الرحماء"
  - { id: 4a87a855-d0f6-4b86-b3d8-646776c993a8, ref: "مسلم 923", reason: fragment, decision:  }
  # "«لا نورث، ما تركنا صدقة»"
  - { id: 4bce7378-a29b-4d74-8982-894a97f7ecc8, ref: "البخاري 6730", reason: short, decision:  }
  # "«أولم ولو بشاة»"
  - { id: 4c38fcde-8fca-43f4-8213-5ba96badc79a, ref: "البخاري 3937", reason: short, decision:  }
  # "وأصحابه واصلوا ولم يذكر السحور»"
  - { id: 4c3c71ae-9071-4705-b9ba-611a42672c51, ref: "البخاري 1921", reason: short, decision:  }
  # "ويلك اركبها ويلك اركبها"
  - { id: 4d13ccef-c14f-45b3-b512-5efb60a49481, ref: "مسلم 1322", reason: short, decision:  }
  # "لا تحرم المصة والمصتان"
  - { id: 4d23eee8-5f35-4165-9977-145fd76cc472, ref: "مسلم 1450", reason: short, decision:  }
  # "\" الإيمان قول وعمل، يزيد وينقص \""
  - { id: 4d94a653-85b7-4dca-af1e-e6df7ac31004, ref: "", reason: short, decision:  }
  # "ما شاء الله أن يقول، ثم أمرهم أن يتعوذوا من عذاب القبر"
  - { id: 4dcc1f27-7945-4829-a667-3f7f09e954d4, ref: "البخاري 1050", reason: fragment, decision:  }
  # "«لا نورث ما تركنا صدقة»"
  - { id: 4dee5583-64a7-4792-a368-be6163eb2841, ref: "البخاري 6727", reason: short, decision:  }
  # "ابن عباس رضي الله عنهما"
  - { id: 4e2629e8-414d-46b9-9c3d-d3590c88e049, ref: "البخاري 1319", reason: short, decision:  }
  # "من ضحك رب العالمين حين قال أتستهزئ مني وأنت رب العالمين فيقول إني لا أستهزئ منك ولكني على ما أشاء قادر"
  - { id: 4e78c2d7-88bf-4ee6-83ff-8886c2df243b, ref: "مسلم 187", reason: fragment, decision:  }
  # "\" الشهداء: الغرق، والمطعون، والمبطون، والهدم \""
  - { id: 4e7bd139-9320-4e23-a164-25ca59cc9737, ref: "البخاري 720", reason: short, decision:  }
  # "بمعنى حديث مالك"
  - { id: 4ef1978f-a372-4c1e-86ea-308fe464db12, ref: "مسلم 2183", reason: short, decision:  }
  # "في الأنهار نحوه. ولم يذكروا: «ثلاثة أقداح»"
  - { id: 4f0de4d5-413b-4677-bde5-b24970646517, ref: "البخاري 5610", reason: fragment, decision:  }
  # "«هما عويم بن ساعدة ومعن بن عدي»"
  - { id: 4fb54f33-8cbc-412c-988c-5ca6a4cad2c8, ref: "البخاري 4021", reason: fragment, decision:  }
  # "بن شهاب فكانت سنة المتلاعنين"
  - { id: 4fc21a05-d04a-4920-b03d-6da0964a768d, ref: "مسلم 1492", reason: short, decision:  }
  # "لم يذكر سمعت"
  - { id: 4fdaf8e9-6981-4d5d-aa69-921f5a5027ca, ref: "مسلم 2059", reason: short, decision:  }
  # "«اشتريها، فإنما الولاء لمن أعتق»"
  - { id: 4fe68bed-c0f0-4afc-b79b-7213012a3995, ref: "البخاري 6759", reason: short, decision:  }
  # "أمر محرما بقتل حية بمنى"
  - { id: 5005341d-bf4f-48a1-b138-f7a754a9ae08, ref: "مسلم 2235", reason: short, decision:  }
  # "«أسلمت على ما سلف من خير»"
  - { id: 503830d7-022e-4fd2-8448-860ecdd797b9, ref: "البخاري 1436", reason: fragment, decision:  }
  # "«لا يرحم الله من لا يرحم الناس»"
  - { id: 504960f9-cff9-4a8b-930b-6033ba0aa319, ref: "البخاري 7376", reason: short, decision:  }
  # "«احتجم في رأسه»"
  - { id: 512338da-0c93-4679-903f-c2d6c9b85aa2, ref: "البخاري 5699", reason: short, decision:  }
  # "«ينصت إذا تكلم الإمام»"
  - { id: 51883c63-b141-46da-8521-ce92f1dbdd19, ref: "البخاري 933", reason: short, decision:  }
  # "«يقبض الله الأرض»"
  - { id: 51a5d200-c7ad-464c-afb8-738d273c668a, ref: "البخاري 7413", reason: short, decision:  }
  # "وسمى الحرب خدعة»"
  - { id: 51ab30cd-f586-4376-82c4-29f1bb16cad3, ref: "البخاري 3028", reason: short, decision:  }
  # "يصلي بالهاجرة»"
  - { id: 51add5d0-c4da-43a4-a786-a0cc228e8e65, ref: "البخاري 539", reason: short, decision:  }
  # "إسماعيل: ينمى ذلك ولم يقل ينمي"
  - { id: 51c840dd-3f38-49a4-be09-e732761ed734, ref: "البخاري 740", reason: short, decision:  }
  # "«لا يسفك بها دما»"
  - { id: 51f66966-2b48-46a7-ac18-6e3af7e5d941, ref: "البخاري 1833", reason: short, decision:  }
  # "أكثر منك شعرا»"
  - { id: 525d879b-5eea-4839-ab30-c515dca32235, ref: "البخاري 256", reason: short, decision:  }
  # "بهذا، وقال سعد بن عبادة"
  - { id: 529bdeb1-4d6d-4c4c-bdb2-c598e0dde2d0, ref: "البخاري 3789", reason: short, decision:  }
  # "«أقركم ما أقركم الله به»"
  - { id: 529df5a3-968a-43e4-8f17-c862bb163499, ref: "البخاري 3166", reason: short, decision:  }
  # "«كنا نؤمر عند الخسوف بالعتاقة»"
  - { id: 52a3fece-2583-454f-b6c6-dbdb36b3d31c, ref: "البخاري 2520", reason: short, decision:  }
  # "قال: «فكوا العاني وأجيبوا الداعي»"
  - { id: 52acf417-f12f-4bb8-94c9-3bd08d07899c, ref: "البخاري 7173", reason: short, decision:  }
  # "فأنا موضع اللبنة جئت فختمت الأنبياء"
  - { id: 52c75e5c-c90c-4b4c-bb74-8cbf4eb8c17a, ref: "مسلم 2287", reason: fragment, decision:  }
  # "وطعن بمخصرته في المنبر هذه طيبة هذه طيبة هذه طيبة يعني المدينة ألا هل كنت حدثتكم ذلك فقال الناس نعم فإنه أعجبني حديث تمي"
  - { id: 5321d38f-d16d-4387-a25d-67a83f4d3880, ref: "مسلم 2942", reason: fragment, decision:  }
  # "من ظلم قيد شبر من الأرض طوقه من سبع أرضين"
  - { id: 53a6b615-8a95-4aed-9424-45b768f2c9a8, ref: "مسلم 1612", reason: fragment, decision:  }
  # "«إن من الشعر حكمة»"
  - { id: 53cb9c6b-8a26-4b11-aea1-619011ddf247, ref: "البخاري 6145", reason: short, decision:  }
  # "قد لقي موسى عليه السلام"
  - { id: 53e5d247-da6f-4eb5-8bb2-ef62d6badf20, ref: "مسلم 165", reason: short, decision:  }
  # "بمثل حديث مالك"
  - { id: 54617756-31ca-4ecb-9637-dade1638717c, ref: "مسلم 1621", reason: short, decision:  }
  # "«أنزلت في الدعاء»"
  - { id: 54eb1607-969b-4e05-b958-73fe07c4c857, ref: "البخاري 6327", reason: short, decision:  }
  # "يذكر الله على كل أحيانه"
  - { id: 54f57018-2e1a-406d-8efe-71d2e7f7bf2f, ref: "مسلم 373", reason: short, decision:  }
  # "ه؟ قلت: نعم، قال لي مرارا، فقلت: أفأقرأ التوراة؟"
  - { id: 555428e0-607e-4ae9-8079-f459e624463d, ref: "البخاري 3305", reason: fragment, decision:  }
  # "«عمل قليلا وأجر كثيرا»"
  - { id: 55a2ade7-7a2e-4d50-8235-85643379390a, ref: "البخاري 2808", reason: short, decision:  }
  # "«لا يعضد شوكه»"
  - { id: 55ff8596-3f0c-4157-bdaa-fc8fb5913fc5, ref: "البخاري 1831", reason: short, decision:  }
  # "«ذهبت أنا وأبو بكر، وعمر، ودخلت أنا وأبو بكر، وعمر، وخرجت أنا وأبو بكر، وعمر»"
  - { id: 5610fa47-3f97-45a0-bd0f-414d4bbd1d34, ref: "البخاري 3685", reason: fragment, decision:  }
  # "قلت يا رسول الله"
  - { id: 5639f868-4749-4ae9-82db-af5c445fe82c, ref: "مسلم 2649", reason: short, decision:  }
  # "«صدق سلمان»"
  - { id: 565bd99c-0e31-4ea1-92a3-f97ab9879fae, ref: "البخاري 1145", reason: short, decision:  }
  # "؟ قال: إني لست بمجنون"
  - { id: 568f01a0-2e0d-4c23-a5d5-df1a3a91a96f, ref: "البخاري 6115", reason: short, decision:  }
  # "كلهم بمعنى حديث أبي سنان"
  - { id: 574949c9-cb27-4083-9097-38540eb55137, ref: "مسلم 977", reason: short, decision:  }
  # "«فبم يشبه الولد»"
  - { id: 5751594e-dfbc-423f-9e81-56bf3d26eb86, ref: "البخاري 3328", reason: short, decision:  }
  # "لا صلاة بحضرة الطعام ولا هو يدافعه الأخبثان"
  - { id: 57786cf1-7c11-4aec-88ac-b6afc9b70e7c, ref: "مسلم 560", reason: fragment, decision:  }
  # "لم يدخل بيتها إلا صلاهما»"
  - { id: 57cc92a2-0169-4d8b-b72e-cb827f578a17, ref: "البخاري 1631", reason: short, decision:  }
  # "عاصم: رأيت القدح وشربت فيه"
  - { id: 585ab595-b5a3-43f4-bb5a-c218a28baf8a, ref: "البخاري 3109", reason: short, decision:  }
  # "إنما جعل الإذن من أجل البصر"
  - { id: 5983e08b-5901-4cf4-bcba-2f5684740a21, ref: "مسلم 2156", reason: fragment, decision:  }
  # "«أحد جبل يحبنا ونحبه» قال أبو عبد الله: «كل بستان عليه حائط فهو حديقة، وما لم يكن عليه حائط لم يقل حديقة»"
  - { id: 59da6292-9da1-43fa-819c-eb6b1b798e0d, ref: "البخاري 1482", reason: fragment, decision:  }
  # "«هي منسوخة»"
  - { id: 5a067001-63e8-4655-9e7f-933b520319d5, ref: "البخاري 4506", reason: short, decision:  }
  # "يصلي في نعليه؟ قال: «نعم»"
  - { id: 5a56a537-eddb-4058-8e09-40ba053e89ae, ref: "البخاري 5850", reason: short, decision:  }
  # "أبواب صفة الصلاة"
  - { id: 5a795257-1116-4d91-a9c0-1b07fabfe598, ref: "البخاري 731", reason: short, decision:  }
  # "«اطلبوه، واقتلوه». فقتله، فنفله سلبه"
  - { id: 5ac47df7-6aff-415d-b329-3a072cac25e8, ref: "البخاري 3051", reason: short, decision:  }
  # "«ابن أخت القوم منهم»"
  - { id: 5b365f28-4b28-46b5-9df4-3b7aaf541fbe, ref: "البخاري 3528", reason: short, decision:  }
  # "لو أنكم تطهرتم ليومكم هذا"
  - { id: 5b681fd5-8ba3-42c8-8bb0-067fe1c48960, ref: "مسلم 847", reason: short, decision:  }
  # "«ذهب المفطرون اليوم بالأجر»"
  - { id: 5bf46948-3937-4712-a1af-224cd3984529, ref: "البخاري 2890", reason: short, decision:  }
  # "رجل فيها برأيه ما شاء"
  - { id: 5c1e3091-c354-46fc-b4f1-c5a1042bae84, ref: "مسلم 1226", reason: short, decision:  }
  # "لأصحابه: «كلوا» وهم محرمون"
  - { id: 5c71ecde-58f2-440a-8392-95a1d2a645d9, ref: "البخاري 1822", reason: short, decision:  }
  # "بمثل حديث مالك وزادوا فيه يوم القيامة"
  - { id: 5cf064e8-512f-4d14-adea-70c49905a083, ref: "مسلم 2085", reason: fragment, decision:  }
  # "الواصلة والمستوصلة»"
  - { id: 5d29e66d-8183-48f9-bafe-8919c69b720d, ref: "البخاري 5936", reason: short, decision:  }
  # "«سبقك عكاشة»"
  - { id: 5d4c4f2e-3d37-4887-8a07-d0ab412c1447, ref: "البخاري 5811", reason: short, decision:  }
  # "«الطاعون شهادة لكل مسلم»"
  - { id: 5dc1ec43-0f55-4c1b-9d5a-edbe19dda173, ref: "البخاري 2830", reason: short, decision:  }
  # "«إذا بايعت فقل لا خلابة»"
  - { id: 5ebd60dc-9c2e-4a6d-a38f-4f455b3bd0cb, ref: "البخاري 6964", reason: short, decision:  }
  # "يتخولنا بها، مخافة السآمة علينا \""
  - { id: 5fe60385-b9df-4167-9344-0d9d169c8b87, ref: "البخاري 70", reason: short, decision:  }
  # "أفلح إن صدق"
  - { id: 5ff30011-944e-49c2-a960-7326a504bba7, ref: "مسلم 11", reason: short, decision:  }
  # "له لو أقمت بهذا"
  - { id: 601b2a49-d9c5-44e4-97e9-8648d005a8e2, ref: "البخاري 1808", reason: short, decision:  }
  # "«هذا أمين هذه الأمة»"
  - { id: 6074e312-9926-456b-a5fc-d396f82cf273, ref: "البخاري 4380", reason: short, decision:  }
  # "أنهلك وفينا الصالحون؟ قال: «نعم إذا كثر الخبث»"
  - { id: 60dd6db4-bf36-428c-b0c4-5bf0202c580b, ref: "البخاري 3598", reason: fragment, decision:  }
  # "يملك أربه"
  - { id: 617e0ba0-bf47-4aa9-8d26-4bc83a99db7c, ref: "مسلم 293", reason: short, decision:  }
  # "«انهكوا الشوارب، وأعفوا اللحى»"
  - { id: 6192b4b5-9e0c-4606-bbf3-0ddee6618c57, ref: "البخاري 5893", reason: short, decision:  }
  # "«نحن أحق بصومه، فأمر بصومه»"
  - { id: 6199ca45-646b-489b-9031-c3ba0c34cd73, ref: "البخاري 3942", reason: short, decision:  }
  # "استصغرت أنا وابن عمر،"
  - { id: 61bed24b-fe05-4e45-9978-e09249a8a698, ref: "البخاري 3955", reason: short, decision:  }
  # "ذاك إبراهيم عليه السلام"
  - { id: 6204d304-c1b8-496b-9762-ecbfd031cbf7, ref: "مسلم 2369", reason: short, decision:  }
  # "من قال ذلك قال قلت ناس من أصحابك قال كذب من قال ذلك بل له أجره مرتين ثم أرسلني إلى علي وهو أرمد فقال لأعطين الراية رجلا"
  - { id: 621df25b-b60a-4b24-986c-afe01f8aaf9a, ref: "مسلم 1807", reason: fragment, decision:  }
  # "«فحج آدم موسى مرتين»"
  - { id: 6245d11d-697d-48aa-bfd3-ba83e61352b9, ref: "البخاري 3409", reason: short, decision:  }
  # "«إن خياركم أحسنكم قضاء»"
  - { id: 6261b873-9daa-4811-9a89-ca2145cb20b5, ref: "البخاري 2393", reason: short, decision:  }
  # "«اللهم ارزق آل محمد قوتا»"
  - { id: 6316a0b9-ac82-411a-8c27-19f7acafdbaf, ref: "البخاري 6460", reason: short, decision:  }
  # "والذي نفسي بيده ما لقيك الشيطان قط سالكا فجا إلا سلك فجا غير فجك"
  - { id: 63dd7d0b-3bf9-4da3-a371-75a7560cf4c0, ref: "مسلم 2396", reason: fragment, decision:  }
  # "يضحي بكبشين، وأنا أضحي بكبشين»"
  - { id: 64a09cf0-ea2b-422a-9e6a-bd63368bb96f, ref: "البخاري 5553", reason: short, decision:  }
  # "رواه جرير بن عبد الحميد، عن الشيباني، عن أبي بردة"
  - { id: 64a3f70d-6383-480c-ac55-de48256f08db, ref: "البخاري 4344", reason: fragment, decision:  }
  # "أعتقيها فإنها من ولد إسماعيل"
  - { id: 64e7b8b5-9426-4059-adce-6c760d1a2557, ref: "مسلم 2525", reason: short, decision:  }
  # "لا ولكن اسمه المنذر فسماه يومئذ المنذر"
  - { id: 64e86c9e-a4dc-4894-b4f5-d58a09c4f3ed, ref: "مسلم 2149", reason: fragment, decision:  }
  # "الحرب خدعة"
  - { id: 64fa741e-da49-467c-9348-8ad2ec5a431a, ref: "مسلم 1740", reason: short, decision:  }
  # "ا: «لم يكن يؤذن يوم الفطر ولا يوم الأضحى»"
  - { id: 6532125c-b225-4912-b040-93fa449f6cfe, ref: "البخاري 960", reason: fragment, decision:  }
  # "تسموا باسمي ولا تكنوا بكنيتي"
  - { id: 65853fdc-35cd-4b73-96f7-9bf675940e1f, ref: "مسلم 2131", reason: short, decision:  }
  # "«اصبروا حتى تلقوني على الحوض»"
  - { id: 65c455fd-5a54-494d-9ada-a2a703128687, ref: "البخاري 7050", reason: short, decision:  }
  # "«لو تركته بين»،"
  - { id: 6611acec-760f-4aa0-908c-5f08ed0796f0, ref: "البخاري 3056", reason: short, decision:  }
  # "فقلت قد رجعت إلى ربي حتى استحييت منه"
  - { id: 661b38fd-5143-4530-80b7-5e43de068a5b, ref: "مسلم 162", reason: fragment, decision:  }
  # "«نصرت بالصبا، وأهلكت عاد بالدبور»"
  - { id: 669e8bd8-9fd1-45c1-ac68-df0eb16619d5, ref: "البخاري 3205", reason: short, decision:  }
  # "قد ذكرها، فلم أكن لأفشي سر رسول الله صلى الله عليه وسلم، ولو تركها لقبلتها"
  - { id: 66ec91ff-de43-4d47-acff-e5001ca664c0, ref: "البخاري 4005", reason: fragment, decision:  }
  # "بعد يستعيذ من عذاب القبر"
  - { id: 66ed8273-bab5-470e-b5d9-338866504a83, ref: "مسلم 584", reason: short, decision:  }
  # "سبقك بها عكاشة"
  - { id: 66f09847-7e71-4360-8d0a-42a74264159b, ref: "مسلم 216", reason: short, decision:  }
  # "بمثل حديث مالك عن نافع"
  - { id: 673fb2bb-22fe-4c4f-a92e-d2e091020dd6, ref: "مسلم 1871", reason: short, decision:  }
  # "«حرمت التجارة في الخمر»"
  - { id: 67414360-63b2-44dd-ab94-5f401b7e1450, ref: "البخاري 2226", reason: short, decision:  }
  # "ولقد سمعته منه مرارا \""
  - { id: 678b175e-643b-495d-ae55-05d2c83137f7, ref: "البخاري 5538", reason: short, decision:  }
  # "نهى عن أكل كل ذي ناب من السبع»"
  - { id: 67a8183d-9d63-45c6-880e-c5831d0cd0ac, ref: "البخاري 5781", reason: fragment, decision:  }
  # "كان زكريا نجارا"
  - { id: 6819f46b-4fe8-441e-9f8d-3563eb11c493, ref: "مسلم 2379", reason: short, decision:  }
  # "أذن للظعن"
  - { id: 6840e467-56ce-4fe3-bc1d-a6c5980513a0, ref: "مسلم 1291", reason: short, decision:  }
  # "«رأيته عبدا» يعني زوج بريرة"
  - { id: 69e4631b-4a2e-4d64-8c9a-eb6cb3384f70, ref: "البخاري 5280", reason: short, decision:  }
  # "«من اعتجن بمائه»"
  - { id: 6a29dec2-89af-4c29-a542-7b176572b189, ref: "البخاري 3378", reason: short, decision:  }
  # "إنه من لا يرحم لا يرحم"
  - { id: 6a2a2f4f-65cd-44e3-8bee-0b2133df19d5, ref: "مسلم 2318", reason: short, decision:  }
  # "«كلب صيد أو ماشية»"
  - { id: 6a4b3ba2-b4b0-4c9f-8edf-1f68283f319c, ref: "البخاري 2322", reason: short, decision:  }
  # "«هكذا وضوء رسول الله صلى الله عليه وسلم»"
  - { id: 6ac2f2d2-4a2d-400f-9f6a-38f45f1178ea, ref: "البخاري 191", reason: fragment, decision:  }
  # "سبحان الله إن المؤمن لا ينجس"
  - { id: 6b02b8f0-c92b-46f7-86ef-2046c07ee6a3, ref: "مسلم 371", reason: fragment, decision:  }
  # "الوضوء مما مست النار"
  - { id: 6b5e0dd9-9799-4cab-94ec-c3dd5bd29761, ref: "مسلم 351", reason: short, decision:  }
  # "\" أشد العبادة القراءة في المصحف \""
  - { id: 6bd43809-bac2-4cd3-8923-b86b68c24606, ref: "", reason: short, decision:  }
  # "من لا يشكر الناس لا يشكر الله."
  - { id: 6be30f25-906f-41f1-8690-88b4162ebc49, ref: "سنن أبي داود (7/ 188) (4811).", reason: short, decision:  }
  # "في البيت المعمور"
  - { id: 6c62598e-5bcc-43da-90bd-c3f5bbb10c5e, ref: "البخاري 3207", reason: short, decision:  }
  # "يأمرنا أن نبردها بالماء»"
  - { id: 6c65e9bb-c45c-46a7-8198-73738f569569, ref: "البخاري 5724", reason: short, decision:  }
  # "«أرجو أن تكون منهم»"
  - { id: 6d09e14b-904e-4b9e-a6c7-4b4c9e6c2bf7, ref: "البخاري 3216", reason: short, decision:  }
  # "ولم يذكر لكن"
  - { id: 6d250462-9329-4e25-b12e-6ddd627e04a0, ref: "مسلم 2250", reason: short, decision:  }
  # "أنس بن مالك"
  - { id: 6d3f8c3a-13b0-4ecd-8eed-a04f86950c34, ref: "البخاري 6889", reason: short, decision:  }
  # "أسلم سالمها الله وغفار غفر الله لها"
  - { id: 6da277ad-982b-450d-8082-398543c699b5, ref: "مسلم 2515", reason: fragment, decision:  }
  # "«لا توردوا الممرض على المصح»"
  - { id: 6e0aaabb-8610-4fa7-845d-42480e4d44a3, ref: "البخاري 5774", reason: short, decision:  }
  # "«أفيدع يده في فيك تقضمها، كأنها في في فحل يقضمها»"
  - { id: 6e47bef1-8561-4efc-adf2-9a2ae96ea1a7, ref: "البخاري 4417", reason: fragment, decision:  }
  # "هذا أعظم الناس شهادة عند رب العالمين"
  - { id: 6e628b17-8384-49bc-9eea-3df2d1bb8259, ref: "مسلم 2938", reason: fragment, decision:  }
  # "يذكر الله على كل أحيانه»"
  - { id: 6e6f1101-28f3-48b6-8715-038878d0479d, ref: "البخاري 633", reason: short, decision:  }
  # "المرء مع من أحب"
  - { id: 6e993bcd-ee76-407a-9154-a4df0065c63d, ref: "مسلم 2640", reason: short, decision:  }
  # "وتبسم إنها ابنة أبي بكر"
  - { id: 6efb7f23-9d15-49e3-834b-d36ec76d66b5, ref: "مسلم 2442", reason: short, decision:  }
  # "وقد أخبرتني أمي: أنها أهلت هي وأختها والزبير وفلان وفلان، بعمرة، فلما مسحوا الركن حلوا"
  - { id: 6f3bbab7-edd8-4f36-8cda-ed1a7d90cded, ref: "البخاري 1642", reason: fragment, decision:  }
  # "«أو مخرجي هم»، قال: نعم، لم يأت رجل قط بمثل ما جئت به إلا عودي، وإن يدركني يومك أنصرك نصرا مؤزرا. ثم لم ينشب ورقة أن توف"
  - { id: 702832f9-b9c9-484b-bf5d-db2a150b34ad, ref: "البخاري 3", reason: fragment, decision:  }
  # "«لا تحلفوا بآبائكم»"
  - { id: 703f4caf-5d65-40f6-8a81-eebab65fe78a, ref: "البخاري 6648", reason: short, decision:  }
  # "يزهق: يهلك \""
  - { id: 70638997-0d70-4e9e-94f0-8dce412e4cb7, ref: "البخاري 4719", reason: short, decision:  }
  # "بادروا الصبح بالوتر"
  - { id: 7063e783-fdd0-4d3c-8393-073b3083f66b, ref: "مسلم 750", reason: short, decision:  }
  # "فحفر له ووضع في قبره ولم يذكر غسلا"
  - { id: 7078769d-8503-485b-8041-45313404a002, ref: "مسلم 2472", reason: fragment, decision:  }
  # "«فنزع أبو بكر ذنوبا أو ذنوبين»"
  - { id: 714caab0-f94d-40b7-aeb0-df3af6e85949, ref: "البخاري 3633", reason: fragment, decision:  }
  # "إن يكن الذي ترى فلن تستطيع قتله"
  - { id: 71c43522-088b-4048-9cd7-cae38513dac2, ref: "مسلم 2924", reason: fragment, decision:  }
  # "وهو «يتعوذ من عذاب القبر»"
  - { id: 7232b847-e974-4347-9d38-530b79479025, ref: "البخاري 1376", reason: short, decision:  }
  # "الأيمنون الأيمنون الأيمنون قال أنس فهي سنة فهي سنة فهي سنة"
  - { id: 727acedc-6688-4edf-9d71-947942f6b04c, ref: "مسلم 2029", reason: short, decision:  }
  # "إني قد رزقت حبها"
  - { id: 72825de3-b8c1-447d-bf2d-909ca6ee444d, ref: "مسلم 2435", reason: short, decision:  }
  # "«لو تركته بين»، وقال شعيب في حديثه: فرفصه رمرمة - أو زمزمة - وقال إسحاق الكلبي، وعقيل: رمرمة، وقال معمر: رمزة"
  - { id: 72c33f6e-ff3a-4adf-a3fe-fde1269bd06d, ref: "البخاري 1355", reason: fragment, decision:  }
  # "إلا آل فلان"
  - { id: 72e19f0a-28e8-4251-8b43-d93750c25951, ref: "مسلم 936", reason: short, decision:  }
  # "وعن صلاة بعد الصبح والعصر»"
  - { id: 732316e4-2137-48ab-aede-88101b240560, ref: "البخاري 1992", reason: short, decision:  }
  # "«هو البغيض النافع»"
  - { id: 736f2035-f732-443b-8000-dd910c47daaf, ref: "البخاري 5690", reason: short, decision:  }
  # "صنع مثل ما صنعت»"
  - { id: 74d78462-c67e-4693-a30d-ea0a859044f7, ref: "البخاري 5616", reason: short, decision:  }
  # "واثنين واثنين واثنين"
  - { id: 74fa12ba-f4c2-4a49-b4cb-49efc2e311ed, ref: "مسلم 2633", reason: short, decision:  }
  # "اللهم اغفر لعبد الله بن قيس ذنبه وادخله يوم القيامة مدخلا كريما قال أبو بردة إحداهما لأبي عامر والأخرى لأبي موسى"
  - { id: 75395dd6-4928-48a1-9020-43c81e99e1c0, ref: "مسلم 2498", reason: fragment, decision:  }
  # "يقبل وهو صائم"
  - { id: 7592f896-638c-493b-a645-f1e6ab9cf7b4, ref: "مسلم 1107", reason: short, decision:  }
  # "«حتى تذهب عاهته»"
  - { id: 7692c46b-b050-44eb-817f-b06df3c83499, ref: "البخاري 1486", reason: short, decision:  }
  # "قال: «التمسوا»،"
  - { id: 7694f7b2-5fb2-4b48-8fc9-b1dc6f2ecb34, ref: "البخاري 2019", reason: short, decision:  }
  # "نعم وأرجو أن تكون منهم"
  - { id: 76a6425d-6aef-478c-b2cf-90e6b37d945f, ref: "مسلم 1027", reason: short, decision:  }
  # "الدنيا متاع وخير متاع الدنيا المرأة الصالحة"
  - { id: 773ff676-f9db-49af-93de-e45a479182d6, ref: "مسلم 1467", reason: short, decision:  }
  # "«إنها تنفي الرجال كما تنفي النار خبث الحديد»"
  - { id: 77e11028-09c8-47ee-a336-17c4d4bb7b2e, ref: "البخاري 1884", reason: fragment, decision:  }
  # "ألا أخذتم إهابها فاستمتعتم به"
  - { id: 78302750-528b-446b-a12d-6e35ca1599cc, ref: "مسلم 364", reason: short, decision:  }
  # "مثله سواء"
  - { id: 78512807-e349-409d-a89f-75f7bda27bb6, ref: "مسلم 2311", reason: short, decision:  }
  # "يقرأ بهما يوم الجمعة"
  - { id: 78657864-d8b8-4fdf-b547-a6dd514b7cf0, ref: "مسلم 877", reason: short, decision:  }
  # "من قرأ بالآيتين،"
  - { id: 7871b703-5217-474c-85d4-7c7b276bbada, ref: "البخاري 5008", reason: short, decision:  }
  # "«إذا جاء أحدكم الجمعة، فليغتسل»"
  - { id: 78a4f62b-6649-4a77-9603-dcab563e07c0, ref: "البخاري 877", reason: short, decision:  }
  # "«انزعوه» فأوفاهم الذي لهم وبقي مثل ما أعطاهم"
  - { id: 78f77aee-c6c5-4fe3-9c6c-79766f560dbf, ref: "البخاري 3580", reason: fragment, decision:  }
  # "«عائذا بالله من ذلك»،"
  - { id: 79343a27-a0bb-414c-adcb-895f8645606b, ref: "البخاري 1049", reason: short, decision:  }
  # "احتجم وهو محرم، واحتجم وهو صائم»"
  - { id: 79847ffc-aca5-499e-bb85-1e37081f1724, ref: "البخاري 1938", reason: short, decision:  }
  # "كان يضرب شعره منكبيه»"
  - { id: 79cf8f70-efd7-4d5a-9514-eb68fa3e35cf, ref: "البخاري 5903", reason: short, decision:  }
  # "«لا تشمن ولا تستوشمن»"
  - { id: 79e7fc94-388e-49f6-a2ab-822a337abb5c, ref: "البخاري 5946", reason: short, decision:  }
  # "رأيت الجنة والنار"
  - { id: 79f5fc3e-11e5-4776-a4eb-33375b9ada3d, ref: "مسلم 426", reason: short, decision:  }
  # "أشهد أن لا إله إلا الله وأني رسول الله لا يلقى الله بهما عبد غير شاك فيحجب عن الجنة"
  - { id: 7a70ea95-130f-49a0-8e50-772d834bd465, ref: "مسلم 27", reason: fragment, decision:  }
  # "«ما شبعنا حتى فتحنا خيبر»"
  - { id: 7a8ff965-69f0-4fd0-91f1-3f776aa5940b, ref: "البخاري 4243", reason: short, decision:  }
  # "إذا كفن أحدكم أخاه فليحسن كفنه"
  - { id: 7ab9d54e-b23c-4a79-8f15-0c96a734aa41, ref: "مسلم 943", reason: fragment, decision:  }
  # "نهى عن النجش"
  - { id: 7b2d4e66-617e-4b67-a32a-26222a370d38, ref: "مسلم 1516", reason: short, decision:  }
  # "«توضأ مرتين مرتين»"
  - { id: 7b5e34d9-820f-4599-9e8c-b6f0f2f29c45, ref: "البخاري 158", reason: short, decision:  }
  # "هذه الخطبة التي سمعها من رسول الله صلى الله عليه وسلم"
  - { id: 7c65d43f-bd44-4930-9fd0-b2eb04145014, ref: "مسلم 1355", reason: fragment, decision:  }
  # "\" {فهل من مدكر} [القمر: 15] \""
  - { id: 7c6cb3f8-8512-41ef-9451-d260360fc58f, ref: "البخاري 4874", reason: short, decision:  }
  # "لبس عليه دعوه"
  - { id: 7cc613fc-b798-4a85-b788-455ee081ab89, ref: "مسلم 2925", reason: short, decision:  }
  # "«قد أجرنا من أجرت يا أم هانئ»، قالت أم هانئ: وذلك ضحى"
  - { id: 7cd68c5b-9394-4e04-814e-a79c8541f67f, ref: "البخاري 3171", reason: fragment, decision:  }
  # "ويل للأعقاب من النار أسبغوا الوضوء"
  - { id: 7cde09f2-7042-47d4-9734-04b979dbac0a, ref: "مسلم 241", reason: fragment, decision:  }
  # "يستحب تأخيرها»"
  - { id: 7cea1967-4ebb-4f85-8c2e-b226f39a634d, ref: "البخاري 571", reason: short, decision:  }
  # "ارجع إلى ثوبك فخذه ولا تمشوا عراة"
  - { id: 7cef86be-5d1b-49f9-83bf-c5929f1897de, ref: "مسلم 341", reason: fragment, decision:  }
  # "\" الشعوب: القبائل العظام، والقبائل: البطون \""
  - { id: 7cf1eb52-d445-4ce8-955e-649ebbef3c43, ref: "البخاري 3489", reason: short, decision:  }
  # "إن الميت يعذب ببكاء الحي"
  - { id: 7d21f17b-5caf-48ac-a6d1-10c728e5f4a9, ref: "مسلم 930", reason: short, decision:  }
  # "«يا أبان اجلس» فلم يقسم لهم"
  - { id: 7d4ab1a7-560b-4834-bdf9-09690bcf8ca5, ref: "البخاري 4238", reason: fragment, decision:  }
  # "كبر عليه أربعا"
  - { id: 7d972022-1c72-4bda-8dc3-1c12c7c48814, ref: "مسلم 954", reason: short, decision:  }
  # "يصومه قال نعم"
  - { id: 7d9d1481-31db-4cbc-bfb2-b36c439c7228, ref: "مسلم 1133", reason: short, decision:  }
  # "وإن قضيبا من أراك"
  - { id: 7da131ba-5117-40ac-8252-a55204d23915, ref: "مسلم 137", reason: short, decision:  }
  # "«الذهب بالذهب مثلا بمثل، والورق بالورق مثلا بمثل»"
  - { id: 7dd7340b-f946-41b6-ad67-187d9abf47e6, ref: "البخاري 2176", reason: fragment, decision:  }
