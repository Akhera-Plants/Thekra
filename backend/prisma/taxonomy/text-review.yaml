  - { id: b8c76772-fb15-4890-910a-da243c132bd3, ref: "البخاري 3346", reason: fragment, decision:  }
  # "قد كان بالبادية"
  - { id: b8c9fa43-cc89-46ee-8fd6-2f243f553891, ref: "مسلم 185", reason: short, decision:  }
  # "«من ابتلي بشيء من هذه البنات كن له سترا من النار»"
  - { id: b96168a5-d2e1-4c65-a801-871c86a36812, ref: "مسلم 2629", reason: fragment, decision:  }
  # "ركعة من آخر الليل"
  - { id: b9684996-46de-47d7-a710-d065c616cd46, ref: "مسلم 753", reason: short, decision:  }
  # "فحمد الله، ثم قال: الله المستعان"
  - { id: b9b62901-f476-4844-835c-9ed3b1aa4806, ref: "البخاري 3693", reason: short, decision:  }
  # "كان يتخولنا بالموعظة في الأيام، كراهية السآمة علينا»"
  - { id: b9be27bc-786d-4b45-b379-0e79a95c2939, ref: "البخاري 6411", reason: fragment, decision:  }
  # "ما شاء الله أن يقول ثم «أمرهم أن يتعوذوا من عذاب القبر»"
  - { id: ba1f8a5a-aad7-4401-9a66-db9303065689, ref: "البخاري 1056", reason: fragment, decision:  }
  # "«هل بلغت ثلاثا؟»"
  - { id: bacfe5d3-05bd-4fb5-bf64-c7f150774114, ref: "البخاري 93", reason: short, decision:  }
  # "أخبروه أن الله يحبه"
  - { id: bb6c0bf3-c6cd-4b8c-a49a-51fe617b4ece, ref: "مسلم 813", reason: short, decision:  }
  # "«حسبت علي بتطليقة»"
  - { id: bb92d34d-b9a5-4cb8-8c0e-d42cb925f0d2, ref: "البخاري 5253", reason: short, decision:  }
  # "«لا تقولي هكذا وقولي ما كنت تقولين»"
  - { id: bbe90a46-bd02-427d-abe4-45834ecbd4bc, ref: "البخاري 4001", reason: fragment, decision:  }
  # "«كذب من قاله، إن له لأجرين - وجمع بين إصبعيه - إنه لجاهد مجاهد، قل عربي نشأ بها مثله»"
  - { id: bcdda844-84c1-4115-a9d6-f8b63dfb17e9, ref: "البخاري 6148", reason: fragment, decision:  }
  # "انا عبد الله ورسوله"
  - { id: bcf06b7c-0778-4474-b7f7-27ac0becfeb8, ref: "مسلم 1439", reason: short, decision:  }
  # "«اصطبح الخمر يوم أحد ناس، ثم قتلوا شهداء»"
  - { id: bd281455-802e-4731-8caf-b7e3e306fddb, ref: "البخاري 4044", reason: fragment, decision:  }
  # "حماد بسم الله الرحمن الرحيم"
  - { id: bd6bbf1d-5b09-4614-b2c5-ca802c716af5, ref: "مسلم 2642", reason: short, decision:  }
  # "«لولا ما مضى من كتاب الله لكان لي ولها شأن»"
  - { id: bd8b9196-7aa7-40fc-8b84-463c044dc048, ref: "البخاري 4747", reason: fragment, decision:  }
  # "ذهب المفطرون اليوم بالأجر"
  - { id: bdc6360c-77af-4b2b-a9b6-b9f262a3d331, ref: "مسلم 1119", reason: short, decision:  }
  # "إنها ستكون"
  - { id: be29dc2e-2b51-4cad-9e9c-9c59ce935aa0, ref: "مسلم 2083", reason: short, decision:  }
  # "«إن فيه شفاء»"
  - { id: be7c661b-6ca2-4fbc-b24b-3eae442fd9b6, ref: "البخاري 5697", reason: short, decision:  }
  # "«الولاء لمن أعتق، وإن اشترطوا مائة شرط»"
  - { id: bfd0bd09-232a-4cf3-8c0b-0e226ccae3ed, ref: "البخاري 2565", reason: fragment, decision:  }
  # "قال: نعم، ثم قال: الله أعلم"
  - { id: bfdc388e-c9c5-4847-9fdc-f52a6edc033d, ref: "البخاري 1937", reason: short, decision:  }
  # "فحج آدم موسى"
  - { id: c011de42-28c1-4591-a43d-b6a01b504e96, ref: "مسلم 2652", reason: short, decision:  }
  # "\" اللهم بارك لأمتي في بكورها \""
  - { id: c05553c5-4665-4969-96eb-7b014bbe0a5d, ref: "مسند أحمد (ط. قرطبة)، رقم 1319، مسند أحمد (ط. قرطبة)، رقم 1322، مسند أحمد (ط. قرطبة)، رقم 1328", reason: short, decision:  }
  # "إنما مثل هذا مثل الذي يصلي وهو مكتوف"
  - { id: c09061e3-e96c-4645-9ec8-be93ef77d095, ref: "مسلم 492", reason: fragment, decision:  }
  # "«بأبي أنت وأمي، والله لا يجمع الله عليك موتتين أما الموتة التي كتبت عليك، فقد متها»"
  - { id: c0aa1177-db28-4c5d-b1f5-e1532da76f8a, ref: "البخاري 4452", reason: fragment, decision:  }
  # "«تسحروا؛ فإن في السحور بركة»"
  - { id: c1cbbffe-be66-4f13-9d92-490d2d44664e, ref: "مسلم 1095", reason: short, decision:  }
  # "«لقد رأيتني وأنا ثلث الإسلام»"
  - { id: c246f4c4-2af3-4602-9fc3-7424227cd80b, ref: "البخاري 3726", reason: short, decision:  }
  # "قال: «لا تمنوا لقاء العدو»"
  - { id: c264c5fc-b670-402e-b3d7-4d5594f78330, ref: "البخاري 3025", reason: short, decision:  }
  # "الواصلة والمستوصلة، والواشمة والمستوشمة»"
  - { id: c295bb4b-ca86-45b1-af25-f3009596774f, ref: "البخاري 5947", reason: short, decision:  }
  # "\" تسمعون ويسمع منكم، ويسمع ممن يسمع منكم \""
  - { id: c2adc4d9-a5cd-4c8c-837d-58965fad59f6, ref: "مسند أحمد (ط. قرطبة)، رقم 2947", reason: short, decision:  }
  # "ولو استزدته لزادني"
  - { id: c2fc9bdb-fab2-4f21-a219-db0f37b09eff, ref: "البخاري 2782", reason: short, decision:  }
  # "\" ما أسكر كثيره فقليله حرام \""
  - { id: c3233ee1-d03b-42ae-9d15-017015c7a22f, ref: "سنن أبي داود، رقم 3681، سنن ابن ماجه، رقم 3393، سنن ابن ماجه، رقم 3394", reason: short, decision:  }
  # "«يفرغ على رأسه ثلاثا»"
  - { id: c37e3065-8e4d-4dfc-8a2b-1e5f9c5c1168, ref: "البخاري 255", reason: short, decision:  }
  # "«أن جبريل كان يعارضه القرآن»"
  - { id: c4119395-3a53-41d8-9aa4-60ef14de8822, ref: "البخاري 3220", reason: short, decision:  }
  # "يصلى الظهر إذا دحضت الشمس"
  - { id: c416d545-6a46-4f07-82ec-25252e5422ae, ref: "مسلم 618", reason: short, decision:  }
  # "\" انظروا إلى حب الأنصار التمر \" , ثم مسح وجهه وسماه عبد الله"
  - { id: c43abc45-ccb9-4cd9-8cda-c5f1564bbc6f, ref: "مسلم 2144", reason: fragment, decision:  }
  # "رخص في العرايا بخرصها»"
  - { id: c43e9949-ee2e-45fa-b0e9-5448206f32ef, ref: "البخاري 2173", reason: short, decision:  }
  # "لا يرث المسلم الكافر ولا يرث الكافر المسلم"
  - { id: c4cd99c5-766a-400e-bffd-c38f17b995b4, ref: "مسلم 1614", reason: short, decision:  }
  # "إني لأعرف أسماءهم وأسماء آبائهم وألوان خيولهم هم خير فوارس على ظهر الأرض يومئذ أو من خير فوارس على ظهر الأرض يومئذ قال ب"
  - { id: c5530111-402d-411f-a66f-a56d4be5c511, ref: "مسلم 2899", reason: fragment, decision:  }
  # "«كنا نقيل ونتغدى بعد الجمعة»"
  - { id: c595bfba-0630-46da-b831-e2f87824a623, ref: "البخاري 6279", reason: short, decision:  }
  # "«أنه نهى عن النهبة والمثلة»"
  - { id: c5ca1b8c-c5cf-47e2-89a9-0885dad7a73c, ref: "البخاري 5516", reason: short, decision:  }
  # "«أولم ولو بشاة»"
  - { id: c6094775-e87b-4ca5-9096-728a89a7ab48, ref: "البخاري 6082", reason: short, decision:  }
  # "«الكلمة الطيبة صدقة»"
  - { id: c630a9be-f89d-4bd6-a4be-241f419d520d, ref: "البخاري 6022", reason: short, decision:  }
  # "لم يزل يلبي حتى بلغ الجمرة"
  - { id: c638521b-17e0-41eb-808d-44034fd982d1, ref: "البخاري 1670", reason: fragment, decision:  }
  # "\" رسول الرجل إلى الرجل إذنه \"."
  - { id: c643388d-d0b2-4d61-8855-ef03e765cf89, ref: "صحيح ابن حبان، رقم 5811", reason: short, decision:  }
  # "«بينا أيوب يغتسل عريانا»"
  - { id: c6c40104-a2e4-4d87-a230-7df6714e9532, ref: "البخاري 279", reason: short, decision:  }
  # "فتنخع فدلكها بنعله اليسرى"
  - { id: c759f94d-ef84-4820-a24d-6f2013c6be57, ref: "مسلم 554", reason: short, decision:  }
  # "لا يدخل الجنة قتات"
  - { id: c7ab11b3-9318-409c-aaa0-32e62e1f6a25, ref: "مسلم 105", reason: short, decision:  }
  # "كان يأتي قباء ماشيا وراكبا»"
  - { id: c7faf74b-7693-4e99-8b17-d55d034c89b1, ref: "البخاري 7326", reason: short, decision:  }
  # "يقرأ في المغرب بالطور»"
  - { id: c8096890-66e2-40ca-a8e6-8ec05f9a291e, ref: "البخاري 3050", reason: short, decision:  }
  # "«وقيت شركم كما وقيتم شرها»"
  - { id: c83bb4fd-b383-44fe-8b9d-9113aa878b12, ref: "البخاري 1830", reason: short, decision:  }
  # "«ما خلأت القصواء»"
  - { id: c8684500-57fb-44a8-a965-6ee288f17e0f, ref: "البخاري 2870", reason: short, decision:  }
  # "شرب من زمزم وهو قائم"
  - { id: c894ab03-227c-4616-a8f3-0ac576c86b27, ref: "مسلم 2027", reason: short, decision:  }
  # "«اللهم اشهد» وودع الناس، فقالوا: هذه حجة الوداع"
  - { id: c944c5dc-1237-48ff-aac6-01b6fc8b4c34, ref: "البخاري 1742", reason: fragment, decision:  }
  # "«من ذبح بعد الصلاة تم نسكه، وأصاب سنة المسلمين»"
  - { id: c9a0f6e3-8cd6-4be0-99fa-5cea6f29eb25, ref: "البخاري 5545", reason: fragment, decision:  }
  # "غفار غفر الله لها واسلم سالمها الله"
  - { id: c9d0bd41-b02f-4536-8e33-510134164d72, ref: "مسلم 2473", reason: fragment, decision:  }
  # "أجب عني اللهم أيده بروح القدس قال اللهم نعم"
  - { id: c9e9c969-39e3-4a0e-9e19-24873bc4ea49, ref: "مسلم 2485", reason: fragment, decision:  }
  # "كان يفعله"
  - { id: ca4b6d85-60d5-44bc-9df4-38f69b113b91, ref: "مسلم 581", reason: short, decision:  }
  # "الله: « أنفق أنفق عليك»"
  - { id: cb2e4acf-2fc0-44a6-84bb-1efc1004cdd8, ref: "البخاري 7496", reason: short, decision:  }
  # "توضئوا مما مست النار"
  - { id: cba67bb1-ab83-4e91-9f65-286484c1e296, ref: "مسلم 353", reason: short, decision:  }
  # "«دعه فإن الحياء من الإيمان»"
  - { id: cbdda406-5af4-4ad2-a9f1-a5766d67685d, ref: "البخاري 24", reason: short, decision:  }
  # "«إذا قاتل أحدكم فليجتنب الوجه»"
  - { id: cc498922-03f5-49f7-8446-adc792778265, ref: "البخاري 2559", reason: short, decision:  }
  # "«لو سلك الناس واديا، وسلكت الأنصار شعبا، لاخترت شعب الأنصار»"
  - { id: cc625bc7-f0ab-4f5f-a172-8dbb6454c1be, ref: "البخاري 4333", reason: fragment, decision:  }
  # "صلاة الأوابين حين ترمض الفصال"
  - { id: ccb886fa-997a-4266-879f-32c2de2bcb25, ref: "مسلم 748", reason: short, decision:  }
  # "أحفوا الشوارب وأعفوا اللحى"
  - { id: ccfb810f-da4c-4b94-8f60-53c201bad7bc, ref: "مسلم 259", reason: short, decision:  }
  # "وتحدثني عن صحيفتك»"
  - { id: cd018e6d-9a52-4848-81e7-f3050e557585, ref: "البخاري 6117", reason: short, decision:  }
  # "«أمسك بعض مالك فهو خير لك»"
  - { id: cdbd7709-7eb8-49d6-9667-a109822ed89d, ref: "البخاري 4676", reason: fragment, decision:  }
  # "بمثل حديث يعقوب"
  - { id: cded6928-531e-4c17-8f00-9585ec030d23, ref: "مسلم 2291", reason: short, decision:  }
  # "إلا في حديث الليث بن سعد"
  - { id: cea9a497-7d3d-4ce1-b479-62b576b71b8f, ref: "مسلم 1501", reason: fragment, decision:  }
  # "«سموا الله عليه وكلوه»"
  - { id: cebe9045-ca68-4f3d-a725-496e1494c1d1, ref: "البخاري 2057", reason: short, decision:  }
  # "البركة في نواصي الخيل"
  - { id: cef4fa3a-1078-4847-8236-5bf62827e7fe, ref: "مسلم 1874", reason: short, decision:  }
  # "«اذهبوا به فارجموه»"
  - { id: cef798da-29b6-4d5a-92fd-704768400697, ref: "البخاري 6815", reason: short, decision:  }
  # "«من ظلم قيد شبر طوقه من سبع أرضين»"
  - { id: cf06ac5b-64c8-4819-8462-55d1a8a501af, ref: "البخاري 3195", reason: fragment, decision:  }
  # "بمثل حديث وكيع وبن نمير"
  - { id: cfa1d4e3-f4f3-4c83-b608-7f57a1350024, ref: "مسلم 2672", reason: short, decision:  }
  # "«يوم عاشوراء إن شاء صام»"
  - { id: cfeb1e1d-9889-492d-96f1-ff6cbe624354, ref: "البخاري 2000", reason: short, decision:  }
  # "إن الظلم ظلمات يوم القيامة"
  - { id: cffd4ccb-2ff7-4d4e-8226-8be5be1dbf31, ref: "مسلم 2579", reason: short, decision:  }
  # "«اتقوا النار ولو بشق تمرة»"
  - { id: d003ead2-5e44-4010-8684-adbd45e32aad, ref: "البخاري 1417", reason: short, decision:  }
  # "«هذا خير من ملء الأرض مثل هذا»"
  - { id: d0428d6f-b123-4e15-b093-0b7d1d1c15ca, ref: "البخاري 6447", reason: fragment, decision:  }
  # "كان يوتر على البعير»"
  - { id: d07cfa3a-edc7-4c78-930b-f21e9814242a, ref: "البخاري 999", reason: short, decision:  }
  # "«من إيمان» مكان «من خير»"
  - { id: d08fd2b1-4a45-4577-8dc9-f1bae631fa0f, ref: "البخاري 44", reason: short, decision:  }
  # "إن أقل ساكني الجنة النساء"
  - { id: d0b8fb82-5a2c-4011-8ce4-8a15b25f916b, ref: "مسلم 2738", reason: short, decision:  }
  # "رأى جبريل له ستمائة جناح"
  - { id: d0bebcb9-8da7-4e38-afa1-220d9dd043ed, ref: "مسلم 174", reason: short, decision:  }
  # "«الأيمن فالأيمن»"
  - { id: d12592e5-6f36-4053-a7e8-92800d161bad, ref: "البخاري 5612", reason: short, decision:  }
  # "«إن من أخيركم أحسنكم خلقا»"
  - { id: d1520f2d-626c-46e7-8069-12e7715a76ed, ref: "البخاري 6029", reason: short, decision:  }
  # "«نحن الآخرون السابقون يوم القيامة»"
  - { id: d1583aba-89b5-4a93-9eaf-49f26ea0d012, ref: "البخاري 7495", reason: short, decision:  }
  # "«إذا راح أحدكم إلى الجمعة فليغتسل»"
  - { id: d1a420a4-50aa-4451-9436-e2cdac15006f, ref: "البخاري 882", reason: fragment, decision:  }
  # "«نحن الآخرون السابقون»"
  - { id: d235a07a-07b1-434b-9bde-52c7470e7f66, ref: "البخاري 238", reason: short, decision:  }
  # "«إن له مرضعا في الجنة»"
  - { id: d26e281b-ebac-4671-a3df-ec7a12d1412b, ref: "البخاري 1382", reason: short, decision:  }
  # "«المؤمن لا ينجس»"
  - { id: d2b1cc60-6bac-47f6-97aa-fee4c1d92e81, ref: "البخاري 1252", reason: short, decision:  }
  # "قال: «بايعوني»"
  - { id: d2bfbe9e-6564-4211-b154-b72490634aa8, ref: "البخاري 3999", reason: short, decision:  }
  # "«أنا النبي لا كذب، أنا ابن عبد المطلب»"
  - { id: d30bce43-cd17-46c6-9314-b62143273fd2, ref: "البخاري 2874", reason: fragment, decision:  }
  # "أتي بمال أو بسبي فقسمه بهذا"
  - { id: d31bdf0a-7028-4bb6-98e7-ded13960cfba, ref: "البخاري 3145", reason: fragment, decision:  }
  # "«آيبون تائبون عابدون، لربنا حامدون» فلم يزل يقولها حتى دخل المدينة"
  - { id: d3897754-6538-40b4-ab2d-ca98de1c00f8, ref: "البخاري 6185", reason: fragment, decision:  }
  # "وإن لنا في هذه البهائم لأجرا فقال في كل كبد رطبة أجر"
  - { id: d3ba01b7-9870-45f5-91e0-95ca93edc7bf, ref: "مسلم 2244", reason: fragment, decision:  }
  # "«الظلم ظلمات يوم القيامة»"
  - { id: d48b3485-e86f-40b2-99b8-4bbc210c421b, ref: "البخاري 2447", reason: short, decision:  }
  # "لا يشاركه فيه أحد بأسانيد جياد"
  - { id: d4afd384-0ee2-4d54-9ece-2ed07ffab16f, ref: "مسلم 1647", reason: fragment, decision:  }
  # "«سموا باسمي ولا تكتنوا بكنيتي»"
  - { id: d5948602-0295-48c6-bfdb-655f18ea0f3b, ref: "البخاري 3114", reason: short, decision:  }
  # "من ابتلى من البنات بشيء فأحسن إليهن كن له سترا من النار"
  - { id: d5bbeb7c-56d7-47c7-9fb5-10389f1fff54, ref: "مسلم 2629", reason: fragment, decision:  }
  # "«فيجتهد أن يوسعها فلا تتسع»"
  - { id: d6032ba4-fe10-4c30-966d-9b0b3d9a5447, ref: "البخاري 2917", reason: short, decision:  }
  # "«من أعتق شقيصا من عبد»،"
  - { id: d61c3dcd-f2be-4e73-b9b4-51c366b3bb0e, ref: "البخاري 2526", reason: short, decision:  }
  # "«قد أجرنا من أجرت يا أم هانئ» قالت أم هانئ: وذاك ضحى"
  - { id: d61e180e-5d30-4d36-9b2d-e4e9e21989da, ref: "البخاري 6158", reason: fragment, decision:  }
  # "أمر بقتله"
  - { id: d69ea743-d8b2-432c-aa19-bb7f5385c581, ref: "البخاري 3306", reason: short, decision:  }
  # "«أشهد أن لا إله إلا الله، وأني رسول الله»"
  - { id: d6d1d3bc-2028-429b-82e3-b1358c4e5747, ref: "البخاري 2484", reason: fragment, decision:  }
  # "يعجبه الحلواء والعسل»"
  - { id: d7896287-cfa6-49ba-b949-dc29a2185674, ref: "البخاري 5614", reason: short, decision:  }
  # "لعن الواصلة والمستوصلة والواشمة والمستوشمة"
  - { id: d7b9dc50-5559-499a-8da4-ac7a4697803d, ref: "مسلم 2124", reason: short, decision:  }
  # "«فمن أعدى الأول»"
  - { id: d7da7a1b-dbff-4bd5-99ff-b20cf11abff0, ref: "البخاري 5770", reason: short, decision:  }
  # "صلى على قبر"
  - { id: d7e4de82-908d-42ab-8304-ff2608fbed58, ref: "مسلم 955", reason: short, decision:  }
  # "«هل تنصرون وترزقون إلا بضعفائكم»"
  - { id: d7fd7e64-6039-4410-8329-bb9e6270826f, ref: "البخاري 2896", reason: short, decision:  }
  # "\" إذا رأيتم المداحين فاحثوا في وجوههم التراب \"."
  - { id: d85b9ffa-6c0a-435d-bd37-7dbe89b39577, ref: "مسلم 3002", reason: fragment, decision:  }
  # "«إنكم سترون ربكم عيانا»"
  - { id: d885c15c-d09e-4589-8570-8e09d1b2e92d, ref: "البخاري 7435", reason: short, decision:  }
  # "«إني لأرجو أن تكون منهم»"
  - { id: d8ef5f37-4808-434e-8702-f1575665a255, ref: "البخاري 2841", reason: short, decision:  }
  # "«لست ممن يصنعه خيلاء»"
  - { id: d92cb909-7a75-49fb-a97d-4da216b67481, ref: "البخاري 5784", reason: short, decision:  }
  # "كان يصلي العصر، والشمس في حجرتها قبل أن تظهر»"
  - { id: d9a31a8f-dea0-439f-878d-2a2a82d153a5, ref: "البخاري 522", reason: fragment, decision:  }
  # "«من نيح عليه يعذب بما نيح عليه»"
  - { id: da30bb85-7e76-483b-a22b-086cb8ee1cae, ref: "البخاري 1291", reason: short, decision:  }
  # "يأمر بتسويتها"
  - { id: da3578f0-648f-46ca-986f-3955edb4a081, ref: "مسلم 968", reason: short, decision:  }
  # "سماه الزور. يعني الواصلة في الشعر»"
  - { id: daea98cb-f554-4a79-bc03-290c2c3f3388, ref: "البخاري 5938", reason: fragment, decision:  }
  # "«المبطون شهيد، والمطعون شهيد»"
  - { id: db0a398c-3ff0-4456-90ea-d1de7f6c7389, ref: "البخاري 5733", reason: short, decision:  }
  # "«أنت أخونا ومولانا»"
  - { id: db7df17c-a7ab-4693-a545-ddebb1dd1672, ref: "البخاري 3729", reason: short, decision:  }
  # "بل هو من أهل الجنة"
  - { id: db982a59-7e4c-450c-a5b4-2d2e59effd53, ref: "مسلم 119", reason: short, decision:  }
  # "فإني أومن بذلك أنا وأبو بكر وعمر"
  - { id: dc0b2436-9c3b-45ce-8d5d-d8750037b8d2, ref: "مسلم 2388", reason: fragment, decision:  }
  # "الوتر ركعة من آخر الليل"
  - { id: dc2d9444-06e7-4146-8f90-87ea85bc94de, ref: "مسلم 752", reason: short, decision:  }
  # "\" السواك مطهرة للفم مرضاة للرب \""
  - { id: dc2db099-6a3f-43e0-8f3d-fe52707c80f9, ref: "البخاري 1933", reason: short, decision:  }
  # "يقرؤها: «فهل من مدكر» دالا"
  - { id: dc79b54a-1823-4518-be2b-da4b1d13223b, ref: "البخاري 4871", reason: short, decision:  }
  # "فإني آخر الأنبياء وإن مسجدي آخر المساجد"
  - { id: dcb49642-31db-476f-834d-b18b251b48db, ref: "مسلم 1394", reason: fragment, decision:  }
  # "«نحن الآخرون السابقون»"
  - { id: ddf4eb12-d667-4a03-8b23-d9fddebe27d5, ref: "البخاري 2956", reason: short, decision:  }
  # "ذلك على المنبر"
  - { id: de00e4ad-7199-4494-a0c5-0b202ddc2808, ref: "مسلم 2518", reason: short, decision:  }
  # "الحلف منفقة للسلعة ممحقة للربح"
  - { id: de822080-4af7-4f32-82b2-3aa626463f1c, ref: "مسلم 1606", reason: short, decision:  }
  # "لئن صدق ليدخلن الجنة"
  - { id: e0603c25-cde8-47bb-bc37-9b4721ff2deb, ref: "مسلم 12", reason: short, decision:  }
  # "لا هجرة بعد ثلاث"
  - { id: e0617b9f-0ecb-485b-82fb-f74bd8bbaec0, ref: "مسلم 2562", reason: short, decision:  }
  # "«لناله رجال من هؤلاء»"
  - { id: e0a01eac-9d42-4fe2-8ae6-504ed87e8926, ref: "البخاري 4898", reason: short, decision:  }
  # "\" ما رأيت منظرا قط إلا القبر أفظع منه \""
  - { id: e1153de1-137e-4091-afd0-a574d6f5a1af, ref: "سنن ابن ماجه، رقم 4267", reason: fragment, decision:  }
  # "«إنما جعل الإذن من قبل البصر»"
  - { id: e11e9ce7-4880-4bf9-b451-c0ce05408ab8, ref: "البخاري 6901", reason: fragment, decision:  }
  # "«هذا خير من ملء الأرض مثل هذا»"
  - { id: e14c2c79-d4db-4b05-baea-047386a96720, ref: "البخاري 5091", reason: fragment, decision:  }
  # "التوكل على الله جماع الإيمان."
  - { id: e1e31b40-1f9d-4737-8fce-10c9d7325f0f, ref: "", reason: short, decision:  }
  # "«إن يكن هو لا تسلط عليه، وإن لم يكن هو فلا خير لك في قتله»،"
  - { id: e23a3aa0-89a5-4527-ba90-db9a2a4def36, ref: "البخاري 6173", reason: fragment, decision:  }
  # "لا نورث ما تركنا فهو صدقة"
  - { id: e24a7fb9-3f9a-475e-940b-35406fe7263d, ref: "مسلم 1758", reason: fragment, decision:  }
  # "أي الحل قال الحل كله"
  - { id: e2c1fb4b-5831-46c4-85ad-077dd5c85dc7, ref: "مسلم 1240", reason: short, decision:  }
  # "«كانت أمي ممن عذر الله»"
  - { id: e2d868cc-0a68-4f2b-88c3-d99575518988, ref: "البخاري 4597", reason: short, decision:  }
  # "عمل هذا يسيرا وأجر كثيرا"
  - { id: e31a79fa-0c65-4349-8601-195c79c4e0fe, ref: "مسلم 1900", reason: short, decision:  }
  # "«أنا فرطكم على الحوض»"
  - { id: e3323481-78c4-49aa-b958-8bb7554be741, ref: "البخاري 6589", reason: short, decision:  }
  # "ولا أقول: إن أحدا أفضل من يونس بن متى \""
  - { id: e4264b62-32f1-4c7c-9b88-343a83b52c2b, ref: "البخاري 3415", reason: fragment, decision:  }
  # "«كان لا يرد الطيب»"
  - { id: e43f356a-b4c0-4e5a-9a2e-f6bac08e1599, ref: "البخاري 5929", reason: short, decision:  }
  # "«يبعثون على نياتهم»"
  - { id: e60f3f41-9018-4fd1-bfdf-8c392bcf5177, ref: "البخاري 1900", reason: short, decision:  }
  # "لولا أن معي الهدي لأحللت"
  - { id: e65be430-ab49-4579-a5d1-e4e2651e1319, ref: "مسلم 1250", reason: short, decision:  }
  # "«أنا من رام هرمز»"
  - { id: e69afb04-e21e-47c8-8f57-4643a32dd5b9, ref: "البخاري 3947", reason: short, decision:  }
  # "«دعهم، أمنا بني أرفدة يعني من الأمن»"
  - { id: e6cb6bbc-0c87-4fcb-b998-30e95ea0fbfe, ref: "البخاري 3530", reason: fragment, decision:  }
  # "لكل نبي حواري وحواري الزبير"
  - { id: e78cbc51-0a93-460a-a091-62e7d5d48f77, ref: "مسلم 2415", reason: short, decision:  }
  # "«الطاعون شهادة لكل مسلم»"
  - { id: e7ff693c-e08a-4853-8684-688c51926e0c, ref: "البخاري 5732", reason: short, decision:  }
  # "كل مما يليك"
  - { id: e82bba8a-59ca-4444-97c0-17c2903a2759, ref: "مسلم 2022", reason: short, decision:  }
  # "«نزلت في النفقة»"
  - { id: e83201a3-1afa-4ebd-b239-716f5e235e4b, ref: "البخاري 4516", reason: short, decision:  }
  # "لم يكن يسرد الحديث كسردكم"
  - { id: e865d723-247b-4a78-b7ef-9a05847b2fd8, ref: "مسلم 2493", reason: short, decision:  }
  # "«اللهم ثبته واجعله هاديا مهديا»"
  - { id: e8c2970a-f09e-4af6-9713-d0352b958ace, ref: "البخاري 3036", reason: short, decision:  }
  # "لقد سألني هذا عن الذي سألني عنه ومالي علم بشيء منه حتى أتاني الله به"
  - { id: e945e6f5-c297-4f20-a869-4b89208f5d0a, ref: "مسلم 315", reason: fragment, decision:  }
  # "«فأمسك فإن معنا هديا»"
  - { id: e9713886-1405-43ee-a9f7-085b71010f57, ref: "البخاري 4353", reason: short, decision:  }
  # "نهى عن التلقي"
  - { id: e9a4a083-f929-44da-9330-22e38877fbc0, ref: "مسلم 1517", reason: short, decision:  }
  # "«أخبروه أن الله يحبه»"
  - { id: e9db63c4-86aa-4679-9c42-4c09c3e74526, ref: "البخاري 7375", reason: short, decision:  }
  # "كان يقنت في الصبح والمغرب"
  - { id: eb4fc0f4-2528-4a00-bad4-a28b6448a566, ref: "مسلم 678", reason: short, decision:  }
  # "من صلى البردين دخل الجنة"
  - { id: eb97067f-dc0c-4308-a4fa-b95df7cfd17e, ref: "مسلم 635", reason: short, decision:  }
  # "نهى عن القزع»"
  - { id: ebcf5ec2-323d-4af9-96e1-7ff18112e5a1, ref: "البخاري 5921", reason: short, decision:  }
  # "ابن شهاب: «فكانت تلك سنة المتلاعنين»"
  - { id: ebe3b00e-3cbe-4e77-b778-d4adc1ad42d9, ref: "البخاري 5259", reason: fragment, decision:  }
  # "«ألا تجيبوا له؟»، قال: قالوا: يا رسول الله، ما نقول؟ قال: «قولوا الله مولانا، ولا مولى لكم»"
  - { id: eccbebf8-40df-4441-a339-ee2d1e10f8b7, ref: "البخاري 3039", reason: fragment, decision:  }
  # "لعله قال بلى قال فإن ذاك كذاك قال فرمى بنسعته وخلى سبيله"
  - { id: ecd18e7e-519a-474a-82ef-a159dd1164ab, ref: "مسلم 1680", reason: fragment, decision:  }
  # "نعم الأدم أو الإدام الخل"
  - { id: ece0bfae-6103-41ae-8d13-508c2d0f2664, ref: "مسلم 2051", reason: short, decision:  }
  # "«لو تركته بين»"
  - { id: ed25a427-aa23-4102-96c0-76473c006b68, ref: "البخاري 2638", reason: short, decision:  }
  # "ما هذه إلا رحمة من الله أفلا كنت آذنتني فنوقظ صاحبينا فيصيبان منها قال فقلت والذي بعثك بالحق ما أبالي إذا أصبتها وأصبتها"
  - { id: ed2df328-10da-457e-8380-bc7302903a92, ref: "مسلم 2055", reason: fragment, decision:  }
  # "من شاء فليصمه ومن شاء فليفطره"
  - { id: edab7ba7-3c6e-41d3-8281-477bd8aa1372, ref: "مسلم 1125", reason: short, decision:  }
  # "«المرء مع من أحب»"
  - { id: ee946387-38b6-4dfc-81da-685ee4885078, ref: "البخاري 6168", reason: short, decision:  }
  # "كان يزور البيت أيام منى»"
  - { id: ef311520-1d23-4e35-a9c6-0635fa0d886e, ref: "البخاري 1731", reason: short, decision:  }
  # "«كيف وقد قيل» ففارقها عقبة، ونكحت زوجا غيره"
  - { id: ef61421d-0edd-4034-bcce-a6d215ece70b, ref: "البخاري 88", reason: fragment, decision:  }
  # "يتجوز من اللباس والبسط"
  - { id: ef78f30d-a8e8-4635-9455-92d3c5e05e27, ref: "البخاري 5842", reason: short, decision:  }
  # "كان أهل بعمرة عام الحديبية»"
  - { id: efa4a9c9-917f-4dee-b995-b941d19e04ee, ref: "البخاري 1806", reason: short, decision:  }
  # "«ويهل أهل اليمن من يلملم»"
  - { id: f026bec1-4c0d-4230-a997-04e040036993, ref: "البخاري 1525", reason: short, decision:  }
  # "«تدمع العين، ويحزن القلب»"
  - { id: f052aa78-65e6-42ab-97d8-83d2aed29ec6, ref: "البخاري 1302", reason: short, decision:  }
  # "«لا تغتروا» ويقال: الذهاب المطر"
  - { id: f0601b4a-a2c0-4aa3-8019-4ed64d70eb5a, ref: "البخاري 6433", reason: short, decision:  }
  # "«أعتقها ثم أصدقها»"
  - { id: f1231bf3-2637-4e48-8150-70c3e6a208a7, ref: "البخاري 5083", reason: short, decision:  }
  # "والمقصرين"
  - { id: f1256fbd-b781-452d-b48e-ba0dea199347, ref: "مسلم 1301", reason: short, decision:  }
  # "«ارفق يا أنجشة، ويحك بالقوارير»"
  - { id: f1769b91-d295-4d13-ab4a-78948c06c0bc, ref: "البخاري 6209", reason: short, decision:  }
  # "إنه وتر يحب الوتر"
  - { id: f1e91b05-c8a7-4528-a098-9cdbc29b5743, ref: "مسلم 2677", reason: short, decision:  }
  # "\" لا تبكيه - أو: ما تبكيه - ما زالت الملائكة تظله بأجنحتها حتى رفع \""
  - { id: f26ce30e-bbac-4d83-83ca-4aa09a120e43, ref: "البخاري 4080", reason: fragment, decision:  }
  # "انظروا إلى حب الأنصار التمر قال فمسح وجهه وسماه عبد الله"
  - { id: f2c7ce15-2c74-464f-8d1b-18fc5bfa191b, ref: "مسلم 2144", reason: fragment, decision:  }
  # "كان ينحر، أو يذبح بالمصلى»"
  - { id: f32a4425-a60e-45bf-9ece-6666e3d7acc7, ref: "البخاري 982", reason: short, decision:  }
  # "\" لا يشكر الله من لا يشكر الناس \""
  - { id: f3befc1b-a60b-4f3e-b4f7-7e26368b9a04, ref: "سنن أبي داود، رقم 4811", reason: short, decision:  }
  # "يا بلال قم فناد بالصلاة"
  - { id: f3c5973c-3833-4066-a824-6717ab7dd1eb, ref: "مسلم 377", reason: short, decision:  }
  # "«الآن يا عمر»"
  - { id: f3e5a3b6-9e70-41d1-8af9-2b2a86cd2c87, ref: "البخاري 6632", reason: short, decision:  }
  # "«هي النخلة»"
  - { id: f46559d7-a15f-4c17-8029-81963ea57935, ref: "البخاري 61", reason: short, decision:  }
  # "أما الطيب الذي بك فاغسله ثلاث مرات وأما الجبة فانزعها ثم اصنع في عمرتك ما تصنع في حجك"
  - { id: f4e601e5-c71d-4d3a-bb73-15fe451a8612, ref: "مسلم 1180", reason: fragment, decision:  }
  # "لله أرحم بعباده من هذه بولدها"
  - { id: f529a246-614e-485e-bafd-83446fcbd276, ref: "مسلم 2754", reason: fragment, decision:  }
  # "إن الله يحب العبد التقي الغني الخفي"
  - { id: f5486ef3-3c37-4e73-aacb-ee76c937d8d4, ref: "مسلم 2965", reason: fragment, decision:  }
  # "«سباب المسلم فسوق، وقتاله كفر»"
  - { id: f5533131-b6b5-425c-9018-fa37be1a126d, ref: "البخاري 7076", reason: short, decision:  }
  # "كتب إلى قيصر يدعوه إلى الإسلام، وبعث بكتابه إليه مع دحية الكلبي، وأمره رسول الله صلى الله عليه وسلم أن يدفعه إلى عظيم بص"
  - { id: f5a4c742-8e09-4b7c-ba7c-1f7d132b9aef, ref: "البخاري 2940", reason: fragment, decision:  }
  # "قضيت بحكم الله وربما قال قضيت بحكم الملك ولم يذكر بن المثنى وربما قال قضيت بحكم الملك"
  - { id: f5f934f3-de75-4065-8c3c-cf5b1d0f2236, ref: "مسلم 1768", reason: fragment, decision:  }
  # "أجود بالخير من الريح المرسلة"
  - { id: f6380ed1-cc90-4577-a13c-635bd21de3b5, ref: "مسلم 2308", reason: short, decision:  }
  # "شراك من نار أو شراكان من نار"
  - { id: f6f232c3-ce5a-4375-a2ac-1fc8d33fc8c0, ref: "مسلم 115", reason: short, decision:  }
  # "«كنت لك كأبي زرع لأم زرع» قال أبو عبد الله: قال سعيد بن سلمة، عن هشام، «ولا تعشش بيتنا تعشيشا» قال أبو عبد الله: \" وقال"
  - { id: f707ab21-a9eb-4344-b5c0-b29b58c66fc1, ref: "البخاري 5189", reason: fragment, decision:  }
  # "«ثم ارفع حتى تطمئن جالسا»"
  - { id: f7495031-f75a-49c2-9c4f-b7568e6b1b14, ref: "البخاري 6252", reason: short, decision:  }
  # "هلك المتنطعون قالها ثلاثا"
  - { id: f849f49d-7114-475d-8cdc-88921a4df610, ref: "مسلم 2670", reason: short, decision:  }
  # "«يغزو جيش الكعبة فيخسف بهم»"
  - { id: f92eae63-6a33-4e03-9dea-85de54c3c41e, ref: "البخاري 1594", reason: short, decision:  }
  # "أبو هريرة نعم"
  - { id: f9987822-0944-498a-ad13-a8fcc3e8d159, ref: "مسلم 198", reason: short, decision:  }
  # "يحب الحلواء والعسل»"
  - { id: f9aa7ff1-22d4-4534-93a1-74b6d9f63a37, ref: "البخاري 5599", reason: short, decision:  }
  # "الدنيا سجن المؤمن وجنة الكافر"
  - { id: fa0f9c82-86de-4e07-a796-adf170658b58, ref: "مسلم 2956", reason: short, decision:  }
  # "\" إذا رأيتم المداحين فاحثوا في وجوههم التراب \""
  - { id: fa6ab039-4444-48c5-8c14-bdc2577e17c9, ref: "مسلم 3002", reason: fragment, decision:  }
  # "«سموا باسمي ولا تكنوا بكنيتي»"
