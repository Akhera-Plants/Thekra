  - { id: 88f1766b-be77-44a1-8fb5-50655032d6b1, ref: "البخاري 1679", reason: short, decision:  }
  # "«وأولاد المشركين، وأما القوم الذين كانوا شطر منهم حسنا وشطر قبيحا، فإنهم قوم خلطوا عملا صالحا وآخر سيئا، تجاوز الله عنهم"
  - { id: 89159519-7aac-4785-9af2-aff57dc3850d, ref: "البخاري 7047", reason: fragment, decision:  }
