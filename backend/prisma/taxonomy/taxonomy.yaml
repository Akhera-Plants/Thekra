# Thekra taxonomy — the single source of truth for public sins (AVOID) and good deeds (DO).
# Authored by the project reviewer, approved by the owner. The importer APPLIES this file; it never invents topics.
#
# Anchors (the scholars' own tabwib, not our guesses):
#   riyad   = Riyad al-Salihin chapter numbers as printed (column `number` in docs/taxonomy/sections/riyad.tsv)
#   kabair  = al-Kabair (al-Dhahabi) kabira ordinal (1..70) — also sets Sin.rank = KABIRA with that reference
#   branches= Shu'ab al-Iman branch numbers (ImanBranch.number) — links topic <-> branch
#   targhib = Sahih al-Targhib section titles: a section maps when its normalised title CONTAINS the phrase
#             AND the title's own verb matches the side (الترغيب في → DO, الترهيب من / ترهيب → AVOID).
#             Mixed titles («الترغيب في … والترهيب من …») map each part to its own topic.
#   zuhd / minhaj / adab = title phrases matched the same way (containment after normalisation).
#   kw      = extra phrases used ONLY for books without explicit anchors here (al-Adab al-Mufrad, Bukhari, Muslim,
#             Minhaj fusul). Those matches are proposals: they go to the review report, not straight to ACCEPTED.
#
# side: AVOID (shows in «أعنّي على ترك معصية») | DO (shows in «دُلّني على طاعة»)
# opposite: the slug of the other side, shown as «بدلًا من ذلك» / «وضدّها».
# contemporary topics have no classical chapter: they show their own curated texts + texts of `derivedFrom`.
# Slugs of the 16 existing curated entities are kept so URLs and favorites keep working.

