# Topic themes — reviewer file.
#
# Short labels that say what a topic page holds. Each label is taken from the
# scholars' chapter titles of that topic (variants merged; no claim that the
# chapters do not make). `match` lists whole-word, normalised substrings of a
# link's chapter title (tashkeel, hamza seats, ta marbuta and punctuation are
# folded); a link takes every theme of its own topic whose pattern occurs.
# Links matching nothing stay untagged and still show under «الكل».
#
# key: unique across the file (it is the ?theme= value). 2–8 themes per topic.
# Proposals and coverage: pnpm taxonomy:themes [--propose] [--topic slug]
# Applied by: pnpm import:taxonomy
